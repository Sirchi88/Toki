<style>:root{
  --bg:oklch(97% .015 80);--card:oklch(100% 0 0);--fg:oklch(22% .03 265);--muted:oklch(52% .04 257);
  --primary:oklch(55% .15 45);--on-primary:oklch(98% .01 80);--secondary:oklch(94% .02 75);--accent:oklch(92% .05 60);
  --border:oklch(90% .015 255);--danger:oklch(55% .22 27);--success:oklch(48% .13 150);--warn:oklch(70% .15 75);
  --c-tarif:oklch(62% .16 45);--c-zk:oklch(55% .14 255);--c-fza:oklch(58% .13 300);--c-tzug:oklch(60% .13 175);--c-sonder:oklch(62% .15 350);--c-krank:oklch(55% .03 260);
  --radius:14px;--shadow:0 1px 2px rgb(0 0 0/.05),0 6px 20px -8px rgb(0 0 0/.12);
  --font-d:'Bebas Neue',Impact,'Arial Narrow',sans-serif;--font-b:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
body[data-theme=sw]{--bg:oklch(100% 0 0);--fg:oklch(15% 0 0);--primary:oklch(15% 0 0);--on-primary:#fff;--secondary:oklch(95% 0 0);--accent:oklch(90% 0 0);--muted:oklch(45% 0 0);--border:oklch(85% 0 0)}
body[data-theme=blau]{--bg:oklch(98% .01 250);--fg:oklch(25% .08 260);--primary:oklch(50% .18 255);--on-primary:#fff;--secondary:oklch(94% .03 250);--accent:oklch(90% .06 250);--border:oklch(88% .03 250);--muted:oklch(48% .06 255)}
body[data-theme=gruen]{--bg:oklch(98% .015 150);--fg:oklch(25% .06 155);--primary:oklch(52% .14 150);--on-primary:#fff;--secondary:oklch(94% .04 150);--accent:oklch(90% .08 150);--border:oklch(88% .04 150);--muted:oklch(46% .05 155)}
body[data-theme=dark]{color-scheme:dark;--bg:#17181c;--card:#222328;--fg:#ececf1;--muted:#9a9ca6;--primary:#2fae78;--on-primary:#fff;--secondary:#2c2e34;--accent:#23392f;--border:#34363d;--success:#6fd39b;--danger:#ff6b6b;--warn:#f0b75a;--shadow:0 1px 2px rgb(0 0 0/.4),0 8px 24px -10px rgb(0 0 0/.6)}
body[data-theme=neon]{color-scheme:dark;--onbg:#fff;--bg:#12062b;--card:rgb(28 12 54/.86);--fg:#f6eaff;--muted:#c3a6e0;--primary:#ff4fd8;--on-primary:#fff;--secondary:rgb(255 255 255/.08);--accent:rgb(65 232 255/.18);--border:rgb(255 79 216/.35);--success:#41e8ff;--danger:#ff5577;--warn:#ffd25a;--c-zk:#41e8ff;--shadow:0 0 0 1px rgb(255 79 216/.15),0 10px 30px -10px rgb(255 79 216/.45)}
body[data-theme=neon] .card,body[data-theme=neon] .amp,body[data-theme=neon] details.fold,body[data-theme=neon] .bal .b{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
body[data-theme=neon] h1{text-shadow:0 0 12px #ff4fd8,0 0 2px #fff}
body[data-theme=dorf]{--onbg:#13254f;--bg:#bfe6ff;--card:rgb(255 255 255/.95);--fg:#13254f;--primary:#d0202e;--on-primary:#fff;--secondary:#eef2fa;--accent:#ffe3e5;--border:#cfd8ea;--muted:#4f6290}
body[data-theme=dorf] .card,body[data-theme=dorf] details.fold{border-top:4px solid #1f3f8f;box-shadow:inset 0 3px 0 #fff,0 1px 2px rgb(0 0 0/.05),0 6px 20px -8px rgb(0 0 0/.12)}
body[data-theme=dorf] .card::after{content:'';position:absolute;left:0;right:0;top:-4px;height:4px;background:linear-gradient(90deg,#d0202e 0 33.3%,#fff 33.3% 66.6%,#1f3f8f 66.6%);border-radius:var(--radius) var(--radius) 0 0}
body[data-theme=arena]{--onbg:#fff;--bg:oklch(20% .06 260);--card:oklch(99% .003 250/.96);--fg:oklch(24% .07 258);--primary:oklch(52% .21 25);--on-primary:#fff;--secondary:oklch(94% .03 250);--accent:oklch(92% .04 25);--border:oklch(85% .05 250);--muted:oklch(45% .06 255)}
body[data-theme=xmas]{--onbg:#fff;--bg:oklch(28% .07 255);--card:oklch(99% .008 150/.96);--fg:oklch(27% .06 155);--primary:oklch(48% .18 25);--on-primary:#fff;--secondary:oklch(94% .04 150);--accent:oklch(92% .08 85);--border:oklch(84% .07 85);--muted:oklch(44% .05 155)}
body[data-theme=fryer]{--bg:oklch(93% .06 80);--card:oklch(99.5% .012 85/.95);--fg:oklch(28% .06 50);--primary:oklch(56% .17 40);--on-primary:#fff;--secondary:oklch(94% .05 85);--accent:oklch(90% .1 90);--border:oklch(84% .08 70);--muted:oklch(48% .06 55)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(96px + env(safe-area-inset-bottom))}
@media (min-width:900px){#app{max-width:560px;padding-top:28px}}

/* Kopf */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-d);font-size:15px;letter-spacing:.18em;color:var(--muted)}

.brand{color:var(--onbg,var(--fg))}.brand img{width:34px;height:34px;border-radius:10px;box-shadow:0 2px 8px rgb(0 0 0/.25)}
.brand span{font-family:var(--font-d);font-size:24px;letter-spacing:.14em}
h1{font-family:var(--font-d);font-weight:400;font-size:44px;line-height:.95;margin:0 0 14px;letter-spacing:.01em}
h1{color:var(--onbg,var(--fg))}body[data-theme=arena] h1,body[data-theme=xmas] h1{text-shadow:0 2px 12px rgb(0 0 0/.35)}
.onbg{color:var(--onbg,var(--fg))!important;opacity:.85}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:999px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;color:var(--fg)}
.iconbtn svg{width:20px;height:20px}

/* Karten */
.card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.card h3{font-family:var(--font-d);font-weight:400;font-size:28px;margin:0;line-height:1}
.label{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.muted{color:var(--muted)}.small{font-size:13px}.xs{font-size:11.5px}
.mt{margin-top:12px}.mt-s{margin-top:6px}
.num{font-variant-numeric:tabular-nums}

/* Eingaben */
.field{width:100%;height:46px;border:1.5px solid var(--border);border-radius:10px;background:var(--card);padding:0 12px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
.field:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in oklch,var(--primary) 20%,transparent)}
.field.big{height:64px;font-family:var(--font-d);font-size:clamp(30px,9vw,40px);padding:0 6px;text-align:center;letter-spacing:.03em}
select.field{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type=time].field,input[type=date].field{min-width:0;max-width:100%}
input[type=time]::-webkit-calendar-picker-indicator{opacity:.45;margin-left:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:10px;border:0;background:var(--primary);color:var(--on-primary);font-weight:600;cursor:pointer;width:100%;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--border)}
.btn.soft{background:var(--secondary);color:var(--fg)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid color-mix(in oklch,var(--danger) 50%,transparent)}
.btn.sm{height:34px;font-size:14px;padding:0 12px;width:auto}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:12px;background:var(--secondary)}
.seg button{border:0;background:transparent;border-radius:9px;height:38px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
body[data-theme=arena] .seg,body[data-theme=xmas] .seg{background:rgb(255 255 255/.18)}
body[data-theme=arena] .seg button,body[data-theme=xmas] .seg button{color:#fff}
body[data-theme=arena] .seg button[aria-pressed=true],body[data-theme=xmas] .seg button[aria-pressed=true]{color:var(--fg)}
body[data-theme=neon] .seg{background:rgb(28 12 54/.8)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:99px;background:var(--border);position:relative;flex:none;cursor:pointer;transition:.2s}
.switch input::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0/.3);transition:.2s}
.switch input:checked{background:var(--primary)}
.switch input:checked::after{left:21px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:99px;border:1.5px solid var(--border);background:var(--card);font-size:13.5px;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--primary);background:var(--accent)}

/* Ampel */
.ampel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.amp{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 10px;box-shadow:var(--shadow);min-width:0;cursor:pointer;text-align:left}
.amp .k{display:flex;align-items:center;gap:5px;font-size:9.5px;letter-spacing:.03em!important;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.amp .v{font-family:var(--font-d);font-size:25px;line-height:1.05;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--success)}
.dot.y{background:var(--warn)}.dot.r{background:var(--danger)}.dot.n{background:var(--border)}

/* Feierabend */
.datebtn{position:relative;display:flex;align-items:center;justify-content:space-between;height:46px;border:1.5px solid var(--border);border-radius:10px;padding:0 12px;font-weight:600;background:var(--card)}
.datebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.worked{display:flex;align-items:center;justify-content:space-between;border-radius:12px;background:var(--primary);color:var(--on-primary);padding:8px 14px;margin-top:12px}
.worked .v{font-family:var(--font-d);font-size:34px;line-height:1}
.notice{border-radius:10px;padding:9px 12px;font-size:14px;font-weight:500;margin-top:10px;display:flex;gap:8px;align-items:flex-start}
.notice.danger{border:2px solid var(--danger);color:var(--danger);background:color-mix(in oklch,var(--danger) 6%,var(--card))}
.notice.info{background:var(--secondary)}
.notice.warn{border:2px solid var(--warn);background:color-mix(in oklch,var(--warn) 12%,var(--card))}
.notice.ok{background:color-mix(in oklch,var(--success) 12%,var(--card));color:var(--success)}
.tiles{display:grid;gap:8px;grid-template-columns:repeat(4,1fr)}
.tile{border-radius:12px;background:var(--secondary);padding:9px 4px;text-align:center;position:relative}
.tile .k{font-size:12px;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--font-d);font-size:28px;color:var(--primary);line-height:1.05}
.tile.max{outline:2px dashed color-mix(in oklch,var(--danger) 45%,transparent)}
.tile.single{grid-column:1/-1}
details.fold{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);margin-bottom:14px}
details.fold summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:11px 14px;cursor:pointer;font-size:14px;font-weight:600}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary .chev{transition:.2s;color:var(--muted)}
details.fold[open] summary .chev{transform:rotate(180deg)}
details.fold .body{padding:0 14px 12px}
.minirow{display:flex;gap:8px;flex-wrap:wrap}

/* Wochen */
.wk-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;cursor:pointer}
.wk-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.big-r{font-family:var(--font-d);font-size:28px;color:var(--primary);line-height:1;white-space:nowrap}
.days{margin-top:12px;display:grid;gap:6px}
.day{display:grid;grid-template-columns:40px 1fr 62px;gap:8px;align-items:center;font-size:13.5px;height:32px}
.day[data-act]{cursor:pointer}
.day .wd{font-weight:700;line-height:1.05}.day .wd small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.bar{position:relative;height:26px;box-sizing:border-box;border-radius:7px;background:var(--secondary);overflow:hidden}
.bar .f{position:absolute;inset:0 auto 0 0;background:color-mix(in oklch,var(--primary) 55%,var(--card));border-radius:7px}
.bar .o{position:absolute;top:0;bottom:0;background:var(--success);border-radius:0 7px 7px 0}
.bar .u{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,color-mix(in oklch,var(--danger) 30%,transparent) 0 4px,transparent 4px 8px)}
.bar .s{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg);opacity:.5}

<nav class="tabs" id="nav" aria-label="Bereiche"></nav>
<script>/* Toki – Rechenkern. Reine Funktionen, keine DOM-Zugriffe. */
const Core = (() => {
  'use strict';

  // ---------- Zeit ----------
  const toMin = (s) => {
    const m = /^(\d{1,2}):(\d{2})$/.exec(s || '');
    return m ? Number(m[1]) * 60 + Number(m[2]) : null;
  };
  const fmtClock = (min) => {
    const t = ((Math.round(min) % 1440) + 1440) % 1440;
    return `${String(Math.floor(t / 60)).padStart(2, '0')}:${String(t % 60).padStart(2, '0')}`;
  };
  const leaveAt = (start, pauseMin, hours) => {
    const s = toMin(start);
    return s === null ? null : fmtClock(s + hours * 60 + pauseMin);
  };
  const workedRaw = (start, end, pauseMin) => {
    const s = toMin(start), e = toMin(end);
    if (s === null || e === null) return null;
    let d = e - s;
    if (d < 0) d += 1440;
    return Math.max(0, d - pauseMin) / 60;
  };
  const MAX_DAY = 10;
  const capDay = (h) => (h > MAX_DAY ? { hours: MAX_DAY, capped: true } : { hours: h, capped: false });

  // ---------- Datum (ISO yyyy-mm-dd, UTC-Mittag) ----------
  const D = (iso) => new Date(iso + 'T12:00:00Z');
  const iso = (d) => d.toISOString().slice(0, 10);
  const addDays = (s, n) => { const d = D(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
  const dow = (s) => D(s).getUTCDay(); // 0 So … 6 Sa
  const monday = (s) => addDays(s, -((dow(s) + 6) % 7));
  const isoWeek = (s) => {
    const t = D(s);
    t.setUTCDate(t.getUTCDate() + 3 - ((t.getUTCDay() + 6) % 7));
    const f = new Date(Date.UTC(t.getUTCFullYear(), 0, 4));
    return 1 + Math.round(((t - f) / 864e5 - 3 + ((f.getUTCDay() + 6) % 7)) / 7);
  };
  const ym = (s) => s.slice(0, 7);
  const todayIso = () => { const n = new Date(); return new Date(n.getTime() - n.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };
  const range = (from, to) => { const out = []; for (let d = from; d <= to; d = addDays(d, 1)) out.push(d); return out; };

  // ---------- Feiertage ----------
  const LAENDER = {
    BW: 'Baden-Württemberg', BY: 'Bayern', BE: 'Berlin', BB: 'Brandenburg', HB: 'Bremen', HH: 'Hamburg',
    HE: 'Hessen', MV: 'Mecklenburg-Vorpommern', NI: 'Niedersachsen', NW: 'Nordrhein-Westfalen',
    RP: 'Rheinland-Pfalz', SL: 'Saarland', SN: 'Sachsen', ST: 'Sachsen-Anhalt', SH: 'Schleswig-Holstein', TH: 'Thüringen',
  };
  const easter = (y) => {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4;
    const f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
    const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
    const month = Math.floor((h + l - 7 * m + 114) / 31), day = ((h + l - 7 * m + 114) % 31) + 1;
    return `${y}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
  };
  const hCache = new Map();
  const holidays = (y, opt) => {
    const land = opt.land || 'BY';
    const key = `${y}|${land}|${opt.mariae}`;
    if (hCache.has(key)) return hCache.get(key);
    const map = new Map();
    const add = (d, n, lands) => { if (!lands || lands.includes(land)) map.set(d, n); };
    const o = easter(y);
    add(`${y}-01-01`, 'Neujahr');
    add(`${y}-01-06`, 'Heilige Drei Könige', ['BW', 'BY', 'ST']);
    add(`${y}-03-08`, 'Frauentag', ['BE', 'MV']);
    add(addDays(o, -2), 'Karfreitag');
    add(addDays(o, 1), 'Ostermontag');
    add(`${y}-05-01`, 'Tag der Arbeit');
    add(addDays(o, 39), 'Christi Himmelfahrt');
    add(addDays(o, 50), 'Pfingstmontag');
    add(addDays(o, 60), 'Fronleichnam', ['BW', 'BY', 'HE', 'NW', 'RP', 'SL']);
    if (land === 'SL' || (land === 'BY' && opt.mariae)) add(`${y}-08-15`, 'Mariä Himmelfahrt');
    add(`${y}-09-20`, 'Weltkindertag', ['TH']);
    add(`${y}-10-03`, 'Tag der Deutschen Einheit');
    add(`${y}-10-31`, 'Reformationstag', ['BB', 'MV', 'SN', 'ST', 'TH', 'HB', 'HH', 'NI', 'SH']);
    add(`${y}-11-01`, 'Allerheiligen', ['BW', 'BY', 'NW', 'RP', 'SL']);
    if (land === 'SN') { // Mittwoch vor dem 23.11.
      let d = `${y}-11-22`; while (dow(d) !== 3) d = addDays(d, -1); add(d, 'Buß- und Bettag');
    }
    add(`${y}-12-25`, '1. Weihnachtstag');
    add(`${y}-12-26`, '2. Weihnachtstag');
    hCache.set(key, map);
    return map;
  };
  const holidayName = (s, opt) => holidays(Number(s.slice(0, 4)), opt).get(s) || null;
  const isWorkday = (s, opt) => { const w = dow(s); return w >= 1 && w <= 5 && !holidayName(s, opt); };
  const workdaysBetween = (from, to, opt, skip) => range(from, to).filter((d) => isWorkday(d, opt) && !(skip && skip(d)));

  // ---------- Einstellungen ----------
  const defaults = () => ({
    theme: 'standard',
    arbeit: { wochenstunden: 35, brotzeit: 15, mittag: 30, land: 'BY', mariae: true, halb24: false, halb31: false },
    lohn: {
      grundlohn: 0, stundenlohn: 0, zeigen: true, auszahlung: 'folgemonat', nettoAbzug: 0,
      sonder: [{ id: 'weihnachtsgeld', name: 'Weihnachtsgeld', art: 'einmalig', monat: 11, modus: 'betrag', wert: 0 }],
    },
    zk: { stand: 0, datum: '', samstagBonus: true, max: 35, min: -35 },
    urlaub: { tarifTage: 30, ugFaktor: 0.5, ugTeiler: 21.75, fzaStand: 0, fzaDatum: '', tzugTage: 8, jahre: {} },
    steuer: { klasse: 1, kirche: true, kinderFB: 0, kinderPV: 0, geburtsjahr: 0, kvZusatz: 2.9, geprueft: false },
  });
  const merge = (base, over) => {
    if (Array.isArray(base)) return Array.isArray(over) ? over : base;
    if (base && typeof base === 'object') {
      const out = { ...base };
      if (over && typeof over === 'object') for (const k of Object.keys(over)) out[k] = k in base ? merge(base[k], over[k]) : over[k];
      return out;
    }
    return over === undefined || over === null ? base : over;
  };
  const tagessoll = (S) => (Number(S.arbeit.wochenstunden) || 35) / 5;
  const stundenlohn = (S) => {
    const h = Number(S.lohn.stundenlohn);
    if (h > 0) return h;
    const g = Number(S.lohn.grundlohn) || 0;
    return g > 0 ? g / ((Number(S.arbeit.wochenstunden) || 35) * 4.35) : 0;
  };
  const holOpt = (S) => ({ land: S.arbeit.land, mariae: S.arbeit.mariae, halb24: S.arbeit.halb24, halb31: S.arbeit.halb31 });
  /** Halber Arbeitstag (Heiligabend/Silvester, falls eingestellt) */
  const halfDay = (d, S) => { const md = d.slice(5); return (md === '12-24' && S.arbeit.halb24) || (md === '12-31' && S.arbeit.halb31); };
  /** Wie viele Urlaubstage ein freier Arbeitstag kostet */
  const dayNeed = (d, S) => (halfDay(d, S) ? 0.5 : 1);
  const yearCfg = (S, y) => { const j = (S.urlaub.jahre || {})[y] || {}; return { tarif: j.tarif ?? S.urlaub.tarifTage, tzug: j.tzug ?? S.urlaub.tzugTage, rest: j.rest, restDatum: j.restDatum || '', tzugRest: j.tzugRest } };

  // ---------- Abwesenheiten ----------
  const TYPES = {
    tarif: { label: 'Tarifurlaub', short: 'TU' },
    zk: { label: 'Zeitkonto', short: 'ZK' },
    fza: { label: 'FZA-Konto', short: 'FZA' },
    tzug: { label: 'T-Zug', short: 'TZ' },
    sonder: { label: 'Sonderurlaub', short: 'SU' },
    krank: { label: 'Krank', short: 'K' },
  };
  /** Samstag/Sonn-/Feiertag: keine Brotzeit, ab 6 Std. Anwesenheit 30 min Mittag (nie unter 6 Std.) */
  const specialPause = (presenceMin) => (presenceMin > 360 ? Math.min(30, presenceMin - 360) : 0);
  const presence = (start, end) => { const a = toMin(start), b = toMin(end); if (a === null || b === null) return null; let d = b - a; if (d < 0) d += 1440; return d; };
  /** Liefert Map iso -> {type, units, id, note} für alle Arbeitstage unter Abwesenheiten (+ halbe Urlaubstage aus Einträgen). */
  const absenceDays = (st) => {
    const opt = holOpt(st.settings);
    const map = new Map();
    for (const a of st.absences || []) {
      const days = workdaysBetween(a.from, a.to || a.from, opt);
      for (const d of days) {
        const need = dayNeed(d, st.settings);
        const units = a.half && days.length === 1 ? Math.min(0.5, need) : need;
        map.set(d, { type: a.type, units, full: units >= need, id: a.id, note: a.note || '' });
      }
    }
    for (const [d, e] of Object.entries(st.entries || {})) {
      if (e.half && !map.has(d)) map.set(d, { type: e.halfType || 'tarif', units: 0.5, full: false, fromEntry: true });
    }
    return map;
  };

  // ---------- Tagesauswertung ----------
  const dayTarget = (d, e, S, absMap) => {
    const opt = holOpt(S);
    const w = dow(d);
    if (w === 0 || w === 6 || holidayName(d, opt)) return 0;
    const ab = absMap && absMap.get(d);
    if (ab && ab.full) return 0;
    if (halfDay(d, S)) return tagessoll(S) / 2;
    if ((e && e.half) || (ab && !ab.full)) return tagessoll(S) / 2;
    return tagessoll(S);
  };

  // ---------- Hauptberechnung: Wochen, Monate, Konten ----------
  const zuschlag = (mehr, rate) => {
    const h25 = Math.min(Math.max(mehr, 0), 6), h50 = Math.max(0, mehr - 6);
    const base = mehr * rate, z25 = h25 * rate * 0.25, z50 = h50 * rate * 0.5;
    return { h25, h50, base, z25, z50, total: base + z25 + z50 };
  };

  const compute = (st, today = todayIso()) => {
    const S = st.settings;
    const opt = holOpt(S);
    const soll = tagessoll(S);
    const rate = stundenlohn(S);
    const absMap = absenceDays(st);
    const entries = st.entries || {};
    const kont = st.kontingent || {};
    const nachByMonth = {};
    for (const n of st.nach || []) nachByMonth[n.month] = (nachByMonth[n.month] || 0) + (Number(n.hours) || 0);

    // Wochen sammeln
    const dates = [...Object.keys(entries), ...absMap.keys()];
    const weeks = [];
    const weekMap = new Map();
    if (dates.length) {
      const first = monday(dates.reduce((a, b) => (a < b ? a : b)));
      const lastDate = dates.reduce((a, b) => (a > b ? a : b));
      const last = monday(lastDate > today ? lastDate : today);
      for (let m = first; m <= last; m = addDays(m, 7)) {
        const w = { monday: m, sunday: addDays(m, 6), kw: isoWeek(m), month: ym(addDays(m, 3)), days: [] };
        weeks.push(w); weekMap.set(m, w);
      }
    }

    const used = {}; // Kontingent je Monat verbraucht
    let zk = Number(S.zk.stand) || 0;
    let fza = Number(S.urlaub.fzaStand) || 0;
    const zkStart = S.zk.datum || '';
    const fzaStart = S.urlaub.fzaDatum || '';
    let zkToday = null, fzaToday = null, zkTodaySum = 0, fzaTodaySum = 0, zkVerplant = 0, zkVerplantTage = 0;

    for (const w of weeks) {
      let wd = 0, sat = 0, satOnly = 0, worked = 0, zkUnits = 0, fzaUnits = 0, capped = 0;
      for (let i = 0; i < 7; i++) {
        const d = addDays(w.monday, i);
        const e = entries[d];
        const ab = absMap.get(d) || null;
        const hol = holidayName(d, opt);
        const day = { date: d, entry: e || null, absence: ab, holiday: hol, target: 0, delta: 0 };
        if (ab && ab.type === 'zk') zkUnits += ab.units;
        if (ab && ab.type === 'fza' && (!fzaStart || d > fzaStart)) fzaUnits += ab.units;
        if (e && !(ab && ab.full)) {
          const t = dayTarget(d, e, S, absMap);
          day.target = t;
          day.delta = e.hours - t;
          worked += e.hours;
          if (e.capped) capped++;
          if (t > 0) wd += e.hours - t;
          else { sat += e.hours; if (dow(d) === 6) satOnly += e.hours; }
        }
        w.days.push(day);
      }
      const zkDebit = zkUnits * soll;
      let T = wd + sat;
      let offset = 0;
      if (zkDebit > 0 && T > 0) { offset = Math.min(T, zkDebit); T -= offset; }
      let zkChange = -zkDebit + offset;
      let mehr = 0, mehrNach = 0, toZK = 0, bonus = 0, under = 0;
      if (T < 0) { under = -T; zkChange += T; }
      else if (T > 0) {
        const u = used[w.month] || 0;
        const baseK = Number(kont[w.month]) || 0;
        const totalK = baseK + (nachByMonth[w.month] || 0);
        const avail = Math.max(0, totalK - u);
        // Samstag zuerst in Mehrarbeit, dann Wochentage
        const satEff = Math.min(satOnly, T);
        const satToMehr = Math.min(satEff, avail);
        const restAvail = avail - satToMehr;
        const wdToMehr = Math.min(T - satEff, restAvail);
        mehr = satToMehr + wdToMehr;
        const baseAvail = Math.max(0, baseK - u);
        mehrNach = Math.max(0, mehr - baseAvail);
        used[w.month] = u + mehr;
        toZK = T - mehr;
        const satToZK = satEff - satToMehr;
        if (S.zk.samstagBonus) bonus = satToZK * 0.25;
        zkChange += toZK + bonus;
      }
      const pay = zuschlag(mehr, rate);
      const Tfull = T + offset;
      /** Zeitkonto-Wirkung nur der Tage lo < d <= hi (Mehrarbeit wird zuerst aus den frühen Tagen bedient) */
      const zkPart = (lo, hi) => {
        if ((!lo || w.monday > lo) && (!hi || w.sunday <= hi)) return zkChange;
        if ((lo && w.sunday <= lo) || (hi && w.monday > hi)) return 0;
        let tp = 0, satP = 0, debitP = 0, beforeT = 0;
        for (const day of w.days) {
          const c = day.entry && !(day.absence && day.absence.full) ? day.entry.hours - day.target : 0;
          if (lo && day.date <= lo) { beforeT += c; continue; }
          if (hi && day.date > hi) continue;
          if (day.absence && day.absence.type === 'zk') debitP += day.absence.units * soll;
          tp += c; if (c && dow(day.date) === 6) satP += day.entry.hours;
        }
        const offP = debitP > 0 && tp > 0 ? Math.min(tp, debitP) : 0;
        let restP = tp - offP;
        if (restP > 0) { const mehrP = Math.max(0, mehr - Math.max(0, beforeT)); restP = Math.max(0, restP - mehrP); }
        const bonusP = restP > 0 && S.zk.samstagBonus ? Math.min(restP, satP) * 0.25 : 0;
        return -debitP + offP + restP + bonusP;
      };
      void Tfull;
      const zkEff = zkPart(zkStart, null);
      zkTodaySum += zkPart(zkStart, today);
      zk += zkEff;
      let fzaNow = 0;
      for (const day of w.days) if (day.absence && day.absence.type === 'fza' && (!fzaStart || day.date > fzaStart) && day.date <= today) fzaNow += day.absence.units * soll;
      fzaTodaySum += fzaNow;
      fza -= fzaUnits * soll;
      for (const day of w.days) if (day.absence && day.absence.type === 'zk' && day.date > today) { zkVerplant += day.absence.units * soll; zkVerplantTage += day.absence.units; }
      Object.assign(w, { worked, wd, sat, satOnly, zkUnits, zkDebit, offset, mehr, mehrNach, toZK, bonus, under, zkChange: zkEff, zkAfter: zk, fzaAfter: fza, pay, capped });
    }
    // Nachträglich eingetragene ZK-/FZA-Tage, die vor dem Stichtag liegen, trotzdem abziehen
    let late = 0, lateF = 0;
    for (const a of st.absences || []) {
      if (!a.created) continue;
      if (a.type === 'zk' && a.created > (Number(S.zk.setAt) || 0) && zkStart) for (const [d, x] of absMap) if (x.id === a.id && d <= zkStart) late += x.units * soll;
      if (a.type === 'fza' && a.created > (Number(S.urlaub.fzaSetAt) || 0) && fzaStart) for (const [d, x] of absMap) if (x.id === a.id && d <= fzaStart) lateF += x.units * soll;
    }
    zk -= late; fza -= lateF;
    zkToday = (Number(S.zk.stand) || 0) + zkTodaySum - late;
    fzaToday = (Number(S.urlaub.fzaStand) || 0) - fzaTodaySum - lateF;

    // Monate
    const months = new Map();
    const mget = (m) => {
      if (!months.has(m)) months.set(m, { month: m, worked: 0, mehr: 0, mehrNach: 0, toZK: 0, bonus: 0, zkChange: 0, under: 0, weeks: [], pay: { h25: 0, h50: 0, base: 0, z25: 0, z50: 0, total: 0 }, days: 0 });
      return months.get(m);
    };
    for (const [d, e] of Object.entries(entries)) { const m = mget(ym(d)); m.worked += e.hours; m.days++; }
    for (const w of weeks) {
      const m = mget(w.month);
      m.weeks.push(w);
      for (const k of ['mehr', 'mehrNach', 'toZK', 'bonus', 'zkChange', 'under']) m[k] += w[k];
      for (const k of Object.keys(m.pay)) m.pay[k] += w.pay[k];
    }
    for (const [m, k] of Object.entries(kont)) { const o = mget(m); o.kontingent = Number(k) || 0; }
    for (const m of months.values()) { m.kontingent = Number(kont[m.month]) || 0; m.nach = nachByMonth[m.month] || 0; m.used = used[m.month] || 0; }

    return { weeks, weekMap, months, zk: zkToday, zkPlanned: zk, zkVerplant, zkVerplantTage, fza: fzaToday, fzaPlanned: fza, absMap, rate, soll };
  };

  // ---------- Urlaubskonten (pro Kalenderjahr) ----------
  const vacation = (st, today = todayIso()) => {
    const S = st.settings;
    const absMap = absenceDays(st);
    const byYear = {};
    const yr = (y) => (byYear[y] ||= { tarif: [], tzug: [], sonder: 0, zk: 0, fza: 0, krank: 0 });
    for (const [d, a] of [...absMap.entries()].sort((x, y) => (x[0] < y[0] ? -1 : 1))) {
      const y = Number(d.slice(0, 4));
      if (a.type === 'tarif' || a.type === 'tzug') yr(y)[a.type].push([d, a.units]);
      else yr(y)[a.type] += a.units;
    }
    const cfgYears = Object.keys(S.urlaub.jahre || {}).map(Number);
    const curY = Number(today.slice(0, 4));
    const startY = Math.min(curY, ...cfgYears, ...Object.keys(byYear).map(Number));
    const endY = Math.max(curY + 1, ...cfgYears, ...Object.keys(byYear).map(Number));
    const res = {};
    let carryIn = 0;
    for (let y = startY; y <= endY; y++) {
      const c = yearCfg(S, y), o = yr(y);
      const hasStand = c.rest !== undefined && c.rest !== null && c.rest !== '';
      const anspruch = Number(c.tarif) || 0;
      let carry = hasStand ? 0 : carryIn;
      let pool = hasStand ? Number(c.rest) : anspruch;
      let fromCarry = 0, fromPool = 0, taken = 0, takenUntilToday = 0, vorStand = 0;
      for (const [d, u] of o.tarif) {
        taken += u;
        if (d <= today) takenUntilToday += u;
        if (hasStand && c.restDatum && d <= c.restDatum) { vorStand += u; continue; }
        if (d <= `${y}-03-31` && carry > 0) { const t = Math.min(carry, u); carry -= t; fromCarry += t; fromPool += u - t; }
        else fromPool += u;
      }
      const rest = pool - fromPool;
      const tzugTaken = o.tzug.reduce((s2, x) => s2 + x[1], 0);
      const tzugHasStand = c.tzugRest !== undefined && c.tzugRest !== null && c.tzugRest !== '';
      const tzugAfter = tzugHasStand && c.restDatum ? o.tzug.filter(([d]) => d > c.restDatum).reduce((s2, x) => s2 + x[1], 0) : tzugTaken;
      res[y] = {
        year: y, anspruch, hasStand, stand: hasStand ? Number(c.rest) : null, standDatum: c.restDatum,
        carryIn: hasStand ? 0 : carryIn, fromCarry, carryLeft: carry, verfallen: carry, // Rest nach 31.03. verfällt
        taken, takenUntilToday, vorStand, rest,
        tzug: tzugTaken, tzugMax: Number(c.tzug) || 0, tzugRest: (tzugHasStand ? Number(c.tzugRest) : Number(c.tzug) || 0) - tzugAfter,
        sonder: o.sonder, krank: o.krank, zkDays: o.zk, fzaDays: o.fza,
      };
      carryIn = Math.max(0, rest);
    }
    return res;
  };

  // ---------- Steuer & Sozialversicherung 2026 (Näherung) ----------
  const P = {
    gfb: 12348, bbgKV: 5812.5, bbgRV: 8450, rv: 0.093, av: 0.013, kv: 0.073, pv: 0.018, pvKinderlos: 0.006,
    anPausch: 1230, saPausch: 36, entlastung2: 4260, kfb: 9756, soliFrei: 20350,
  };
  const est = (zve) => {
    const x = Math.floor(Math.max(0, zve));
    let t;
    if (x <= 12348) t = 0;
    else if (x <= 17799) { const y = (x - 12348) / 1e4; t = (914.51 * y + 1400) * y; }
    else if (x <= 69878) { const z = (x - 17799) / 1e4; t = (173.1 * z + 2397) * z + 1034.87; }
    else if (x <= 277825) t = 0.42 * x - 11135.63;
    else t = 0.45 * x - 19470.38;
    return Math.floor(t);
  };
  const tarifFor = (zve, klasse) => {
    if (klasse === 3) return 2 * est(zve / 2);
    if (klasse === 5 || klasse === 6) {
      const diff = (est(zve * 1.25) - est(zve * 0.75)) * 2;
      return Math.max(diff, Math.floor(zve * 0.14));
    }
    return est(zve);
  };
  const svRates = (T, land) => {

<script>/* Toki – Cloud-Sync mit Supabase (Login per E-Mail-Link, eine Zeile pro Person). Keine Bibliothek nötig. */
const Sync = (() => {
  'use strict';
  const BASE = 'https://niqkdhjzcpmyjuopgrnu.supabase.co';
  // Publishable Key: darf öffentlich im Code stehen, Zugriff regeln die RLS-Policies der Tabelle.
  const KEY = 'sb_publishable_6yXuxHgXlb12TCTrcKYkUg_Z7l6HXxA';
  const SKEY = 'toki-session';
  const TABLE = 'toki_daten';

  const read = () => { try { return JSON.parse(localStorage.getItem(SKEY)); } catch { return null; } };
  let session = read();
  const store = (s) => { session = s; try { if (s) localStorage.setItem(SKEY, JSON.stringify(s)); else localStorage.removeItem(SKEY); } catch { /* */ } };
  const jwt = (t) => { try { return JSON.parse(decodeURIComponent(escape(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'))))); } catch { return {}; } };
  const headers = (extra = {}) => ({ apikey: KEY, 'Content-Type': 'application/json', ...extra });
  const errText = async (r) => { const j = await r.json().catch(() => ({})); return j.msg || j.error_description || j.message || j.error || `Fehler ${r.status}`; };

  /** Läuft die Seite an einem Ort, von dem aus Supabase erreichbar ist? (nicht in der Claude-Vorschau / als Datei) */
  const available = () => /^https?:$/.test(location.protocol) && !/(^|\.)claude\.ai$|claudeusercontent|anthropic/.test(location.hostname);

  /** Nach dem Klick auf den Login-Link stehen die Tokens im #-Teil der Adresse. */
  function fromHash() {
    const h = location.hash || '';
    if (!/access_token=|error=|error_description=/.test(h)) return null;
    const p = new URLSearchParams(h.slice(1));
    try { history.replaceState(null, '', location.pathname + location.search); } catch { /* */ }
    if (p.get('error') || p.get('error_description')) return { error: (p.get('error_description') || p.get('error')).replace(/\+/g, ' ') };
    const at = p.get('access_token');
    const pl = jwt(at);
    store({ access_token: at, refresh_token: p.get('refresh_token'), expires_at: Number(p.get('expires_at')) || Math.floor(Date.now() / 1000) + Number(p.get('expires_in') || 3600), user: { id: pl.sub, email: pl.email } });
    return { ok: true };
  }

  async function token() {
    if (!session) throw new Error('Nicht angemeldet');
    if (session.expires_at - 60 > Date.now() / 1000) return session.access_token;
    const r = await fetch(`${BASE}/auth/v1/token?grant_type=refresh_token`, { method: 'POST', headers: headers(), body: JSON.stringify({ refresh_token: session.refresh_token }) });
    if (!r.ok) { if (r.status === 400 || r.status === 401) store(null); throw new Error('Anmeldung abgelaufen – bitte neu anmelden'); }
    const j = await r.json();
    store({ access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at || Math.floor(Date.now() / 1000) + (j.expires_in || 3600), user: { id: (j.user && j.user.id) || session.user.id, email: (j.user && j.user.email) || session.user.email } });
    return session.access_token;
  }

  async function sendLink(email, redirectTo) {
    const r = await fetch(`${BASE}/auth/v1/otp?redirect_to=${encodeURIComponent(redirectTo)}`, { method: 'POST', headers: headers(), body: JSON.stringify({ email, create_user: true }) });
    if (!r.ok) throw new Error(await errText(r));
  }

  /** Eigenen Datensatz holen: { daten, aktualisiert } oder null */
  async function pull() {
    const t = await token();
    const r = await fetch(`${BASE}/rest/v1/${TABLE}?select=daten,aktualisiert`, { headers: headers({ Authorization: `Bearer ${t}` }) });
    if (!r.ok) throw new Error(await errText(r));
    const rows = await r.json();
    return rows[0] || null;
  }

  async function push(daten, updatedMs) {
    const t = await token();
    const r = await fetch(`${BASE}/rest/v1/${TABLE}?on_conflict=user_id`, {
      method: 'POST',
      headers: headers({ Authorization: `Bearer ${t}`, Prefer: 'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify({ user_id: session.user.id, daten, aktualisiert: new Date(updatedMs || Date.now()).toISOString() }),
    });
    if (!r.ok) throw new Error(await errText(r));
  }

  async function logout() {
    try { if (session) await fetch(`${BASE}/auth/v1/logout`, { method: 'POST', headers: headers({ Authorization: `Bearer ${session.access_token}` }) }); } catch { /* egal */ }
    store(null);
  }

  return { get session() { return session; }, available, fromHash, sendLink, pull, push, logout };
})();
</script>
