<style>:root{
  --bg:oklch(97% .015 80);--card:oklch(100% 0 0);--fg:oklch(22% .03 265);--muted:oklch(52% .04 257);
  --primary:oklch(55% .15 45);--on-primary:oklch(98% .01 80);--secondary:oklch(94% .02 75);--accent:oklch(92% .05 60);
  --border:oklch(90% .015 255);--danger:oklch(55% .22 27);--success:oklch(48% .13 150);--warn:oklch(70% .15 75);
  --c-tarif:oklch(62% .16 45);--c-zk:oklch(55% .14 255);--c-fza:oklch(58% .13 300);--c-tzug:oklch(60% .13 175);--c-sonder:oklch(62% .15 350);--c-krank:oklch(55% .21 27);
  --radius:14px;--shadow:0 1px 2px rgb(0 0 0/.05),0 6px 20px -8px rgb(0 0 0/.12);
  --font-d:'Bebas Neue',Impact,'Arial Narrow',sans-serif;--font-b:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
body[data-theme=sw]{--bg:oklch(100% 0 0);--fg:oklch(15% 0 0);--primary:oklch(15% 0 0);--on-primary:#fff;--secondary:oklch(95% 0 0);--accent:oklch(90% 0 0);--muted:oklch(45% 0 0);--border:oklch(85% 0 0)}
body[data-theme=blau]{--bg:oklch(98% .01 250);--fg:oklch(25% .08 260);--primary:oklch(50% .18 255);--on-primary:#fff;--secondary:oklch(94% .03 250);--accent:oklch(90% .06 250);--border:oklch(88% .03 250);--muted:oklch(48% .06 255)}
body[data-theme=gruen]{--bg:oklch(98% .015 150);--fg:oklch(25% .06 155);--primary:oklch(52% .14 150);--on-primary:#fff;--secondary:oklch(94% .04 150);--accent:oklch(90% .08 150);--border:oklch(88% .04 150);--muted:oklch(46% .05 155)}
body[data-theme=dark]{color-scheme:dark;--bg:#17181c;--card:#222328;--fg:#ececf1;--muted:#9a9ca6;--primary:#2fae78;--on-primary:#fff;--secondary:#2c2e34;--accent:#23392f;--border:#34363d;--success:#6fd39b;--danger:#ff6b6b;--warn:#f0b75a;--shadow:0 1px 2px rgb(0 0 0/.4),0 8px 24px -10px rgb(0 0 0/.6)}
body[data-theme=neon]{color-scheme:dark;--onbg:#fff;--bg:#12062b;--card:rgb(28 12 54/.86);--fg:#f6eaff;--muted:#c3a6e0;--primary:#ff4fd8;--on-primary:#fff;--secondary:rgb(255 255 255/.08);--accent:rgb(65 232 255/.18);--border:rgb(255 79 216/.35);--success:#41e8ff;--danger:#ff5577;--warn:#ffd25a;--c-zk:#41e8ff;--shadow:0 0 0 1px rgb(255 79 216/.15),0 10px 30px -10px rgb(255 79 216/.45)}
body[data-theme=neon] .card,body[data-theme=neon] .amp,body[data-theme=neon] details.fold,body[data-theme=neon] .bal .b{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
body[data-theme=neon] h1{text-shadow:0 0 12px #ff4fd8,0 0 2px #fff}
body[data-theme=dorf]{--onbg:#13254f;--bg:#bfe6ff;--card:rgb(255 255 255/.95);--fg:#13254f;--primary:#d0202e;--on-primary:#fff;--secondary:#eef2fa;--accent:#ffe3e5;--border:#cfd8ea;--muted:#4f6290}
body[data-theme=dorf] .card,body[data-theme=dorf] details.fold{border-top:4px solid #1f3f8f;box-shadow:inset 0 3px 0 #fff,0 1px 2px rgb(0 0 0/.05),0 6px 20px -8px rgb(0 0 0/.12)}
body[data-theme=dorf] .card::after{content:'';position:absolute;left:0;right:0;top:-4px;height:4px;background:linear-gradient(90deg,#d0202e 0 33.3%,#fff 33.3% 66.6%,#1f3f8f 66.6%);border-radius:var(--radius) var(--radius) 0 0}
body[data-theme=werk]{--onbg:#fff;--bg:#2a3442;--card:rgb(250 251 252/.96);--fg:#1c2530;--muted:#5d6874;--primary:#2f6fb3;--on-primary:#fff;--secondary:#eef1f4;--accent:#fff4c2;--border:#d3d9df}
body[data-theme=werk] .card,body[data-theme=werk] details.fold{border-top:0;box-shadow:0 1px 2px rgb(0 0 0/.1),0 10px 28px -10px rgb(0 0 0/.55)}
body[data-theme=werk] .card::before{content:'';position:absolute;left:0;right:0;top:0;height:5px;border-radius:var(--radius) var(--radius) 0 0;background:repeating-linear-gradient(-45deg,#f2c200 0 10px,#1b1b1b 10px 20px)}
body[data-theme=werk] h1{text-shadow:0 2px 10px rgb(0 0 0/.5)}
body[data-theme=werk] .seg{background:rgb(255 255 255/.15)}body[data-theme=werk] .seg button{color:#fff}body[data-theme=werk] .seg button[aria-pressed=true]{color:var(--fg)}
body[data-theme=schrank]{--onbg:#2d3236;--bg:#cfd2cf;--card:rgb(250 251 250/.97);--fg:#24292d;--muted:#5f666b;--primary:#c4161c;--on-primary:#fff;--secondary:#eceeec;--accent:#fff1c2;--border:#c3c8c3;--radius:10px}
body[data-theme=schrank] .card,body[data-theme=schrank] details.fold,body[data-theme=schrank] .amp,body[data-theme=schrank] .bal .b{border:1.5px solid #9ea39e;box-shadow:inset 0 1px 0 #fff,0 2px 0 #a9aea9,0 8px 18px -8px rgb(0 0 0/.3)}
body[data-theme=schrank] .card::after{content:'';position:absolute;top:8px;right:10px;width:10px;height:10px;border-radius:50%;background:#2ecc71;box-shadow:0 0 6px #2ecc71}
body[data-theme=schrank] #app{padding-bottom:calc(220px + env(safe-area-inset-bottom))}
body[data-theme=schrank] h1{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:800;font-size:34px;letter-spacing:-.02em}
body[data-theme=arena]{--onbg:#fff;--bg:oklch(20% .06 260);--card:oklch(99% .003 250/.96);--fg:oklch(24% .07 258);--primary:oklch(52% .21 25);--on-primary:#fff;--secondary:oklch(94% .03 250);--accent:oklch(92% .04 25);--border:oklch(85% .05 250);--muted:oklch(45% .06 255)}
body[data-theme=xmas]{--onbg:#fff;--bg:oklch(28% .07 255);--card:oklch(99% .008 150/.96);--fg:oklch(27% .06 155);--primary:oklch(48% .18 25);--on-primary:#fff;--secondary:oklch(94% .04 150);--accent:oklch(92% .08 85);--border:oklch(84% .07 85);--muted:oklch(44% .05 155)}
body[data-theme=fryer]{--bg:oklch(93% .06 80);--card:oklch(99.5% .012 85/.95);--fg:oklch(28% .06 50);--primary:oklch(56% .17 40);--on-primary:#fff;--secondary:oklch(94% .05 85);--accent:oklch(90% .1 90);--border:oklch(84% .08 70);--muted:oklch(48% .06 55)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:hidden;overscroll-behavior-x:none}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;overflow-x:hidden;overflow-x:clip;max-width:100vw}
button,input,select,textarea{font:inherit;color:inherit}
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(96px + env(safe-area-inset-bottom))}
@media (min-width:900px){#app{max-width:560px;padding-top:28px}}

/* Kopf */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--font-d);font-size:15px;letter-spacing:.18em;color:var(--muted)}

.brand{color:var(--onbg,var(--fg))}.brand img{width:34px;height:34px;border-radius:10px;box-shadow:0 2px 8px rgb(0 0 0/.25)}
.brand span{font-family:var(--font-d);font-size:24px;letter-spacing:.14em}
h1{font-family:var(--font-d);font-weight:400;font-size:44px;line-height:.95;margin:0 0 14px;letter-spacing:.01em}
h1{color:var(--onbg,var(--fg))}body[data-theme=arena] h1,body[data-theme=xmas] h1{text-shadow:0 2px 12px rgb(0 0 0/.35)}
.onbg{color:var(--onbg,var(--fg))!important;opacity:.85}
.iconbtn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:999px;border:1.5px solid var(--border);background:var(--card);cursor:pointer;color:var(--fg)}
.iconbtn svg{width:20px;height:20px}

/* Karten */
.card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h2{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 10px}
.card h3{font-family:var(--font-d);font-weight:400;font-size:28px;margin:0;line-height:1}
.label{display:block;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.muted{color:var(--muted)}.small{font-size:13px}.xs{font-size:11.5px}
.mt{margin-top:12px}.mt-s{margin-top:6px}
.num{font-variant-numeric:tabular-nums}

/* Eingaben */
.field{width:100%;height:46px;border:1.5px solid var(--border);border-radius:10px;background:var(--card);padding:0 12px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
.field:focus{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in oklch,var(--primary) 20%,transparent)}
.field.big{height:64px;font-family:var(--font-d);font-size:clamp(30px,9vw,40px);padding:0 6px;text-align:center;letter-spacing:.03em}
select.field{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 20px,calc(100% - 13px) 20px;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type=time].field,input[type=date].field{min-width:0;max-width:100%}
input[type=time]::-webkit-calendar-picker-indicator{opacity:.45;margin-left:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:10px;border:0;background:var(--primary);color:var(--on-primary);font-weight:600;cursor:pointer;width:100%;font-size:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--fg);border:1.5px solid var(--border)}
.btn.soft{background:var(--secondary);color:var(--fg)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid color-mix(in oklch,var(--danger) 50%,transparent)}
.btn.sm{height:34px;font-size:14px;padding:0 12px;width:auto}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:12px;background:var(--secondary)}
.seg button{border:0;background:transparent;border-radius:9px;height:38px;font-weight:600;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--fg);box-shadow:var(--shadow)}
body[data-theme=arena] .seg,body[data-theme=xmas] .seg{background:rgb(255 255 255/.18)}
body[data-theme=arena] .seg button,body[data-theme=xmas] .seg button{color:#fff}
body[data-theme=arena] .seg button[aria-pressed=true],body[data-theme=xmas] .seg button[aria-pressed=true]{color:var(--fg)}
body[data-theme=neon] .seg{background:rgb(28 12 54/.8)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:99px;background:var(--border);position:relative;flex:none;cursor:pointer;transition:.2s}
.switch input::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0/.3);transition:.2s}
.switch input:checked{background:var(--primary)}
.switch input:checked::after{left:21px}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:99px;border:1.5px solid var(--border);background:var(--card);font-size:13.5px;font-weight:600;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--primary);background:var(--accent)}

/* Ampel */
.ampel{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.amp{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:8px 10px;box-shadow:var(--shadow);min-width:0;cursor:pointer;text-align:left}
.amp .k{display:flex;align-items:center;gap:5px;font-size:9.5px;letter-spacing:.03em!important;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.amp .v{font-family:var(--font-d);font-size:25px;line-height:1.05;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--success)}
.dot.y{background:var(--warn)}.dot.r{background:var(--danger)}.dot.n{background:var(--border)}

/* Feierabend */
.datebtn{position:relative;display:flex;align-items:center;justify-content:space-between;height:46px;border:1.5px solid var(--border);border-radius:10px;padding:0 12px;font-weight:600;background:var(--card)}
.datebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.worked{display:flex;align-items:center;justify-content:space-between;border-radius:12px;background:var(--primary);color:var(--on-primary);padding:8px 14px;margin-top:12px}
.worked .v{font-family:var(--font-d);font-size:34px;line-height:1}
.notice{border-radius:10px;padding:9px 12px;font-size:14px;font-weight:500;margin-top:10px;display:flex;gap:8px;align-items:flex-start}
.notice.danger{border:2px solid var(--danger);color:var(--danger);background:color-mix(in oklch,var(--danger) 6%,var(--card))}
.notice.info{background:var(--secondary)}
.notice.warn{border:2px solid var(--warn);background:color-mix(in oklch,var(--warn) 12%,var(--card))}
.notice.ok{background:color-mix(in oklch,var(--success) 12%,var(--card));color:var(--success)}
.tiles{display:grid;gap:8px;grid-template-columns:repeat(4,1fr)}
.tile{border-radius:12px;background:var(--secondary);padding:9px 4px;text-align:center;position:relative}
.tile .k{font-size:12px;color:var(--muted);font-weight:600}
.tile .v{font-family:var(--font-d);font-size:28px;color:var(--primary);line-height:1.05}

.tile.single{grid-column:1/-1}
details.fold{background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);margin-bottom:14px}
details.fold summary{list-style:none;display:flex;align-items:center;justify-content:space-between;padding:11px 14px;cursor:pointer;font-size:14px;font-weight:600}
details.fold summary::-webkit-details-marker{display:none}
details.fold summary .chev{transition:.2s;color:var(--muted)}
details.fold[open] summary .chev{transform:rotate(180deg)}
details.fold .body{padding:0 14px 12px}
.minirow{display:flex;gap:8px;flex-wrap:wrap}

/* Wochen */
.wk-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;cursor:pointer}
.wk-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.big-r{font-family:var(--font-d);font-size:28px;color:var(--primary);line-height:1;white-space:nowrap}
.days{margin-top:12px;display:grid;gap:6px}
.day{display:grid;grid-template-columns:40px 1fr 62px;gap:8px;align-items:center;font-size:13.5px;height:32px}
.day[data-act]{cursor:pointer}
.day .wd{font-weight:700;line-height:1.05}.day .wd small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.bar{position:relative;height:26px;box-sizing:border-box;border-radius:7px;background:var(--secondary);overflow:hidden}
.bar .f{position:absolute;inset:0 auto 0 0;background:color-mix(in oklch,var(--primary) 28%,var(--card));border-radius:7px}
.bar .o{position:absolute;top:0;bottom:0;background:var(--primary);border-radius:0 7px 7px 0}
.bar .u{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(135deg,color-mix(in oklch,var(--danger) 30%,transparent) 0 4px,transparent 4px 8px)}
.bar .s{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--fg);opacity:.5}
.bar .t{position:absolute;inset:0;display:flex;align-items:center;padding:0 8px;font-size:12px;font-weight:600;white-space:nowrap}
.bar.abs{display:flex;align-items:center;padding:0 8px;font-size:12px;font-weight:700;color:#fff}
.bar.hol{background:repeating-linear-gradient(135deg,var(--secondary) 0 6px,var(--accent) 6px 12px);display:flex;align-items:center;padding:0 8px;font-size:12px;font-weight:600}
.bar.empty{background:transparent;height:26px}.bar.empty::after{content:'';position:absolute;left:0;right:0;top:12px;border-top:2px dashed var(--border)}
.dv{font-weight:700;min-width:58px;text-align:right;font-variant-numeric:tabular-nums}
.pos{color:var(--success)}.neg{color:var(--danger)}
.del{border:0;background:transparent;color:var(--muted);cursor:pointer;padding:0 2px;font-size:15px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.kpi{background:var(--secondary);border-radius:10px;padding:7px 9px}
.kpi .k{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--font-d);font-size:23px;line-height:1.05}
.kpi.hl{background:color-mix(in oklch,var(--success) 16%,var(--card))}
.kpi.nach{background:color-mix(in oklch,var(--warn) 25%,var(--card))}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--secondary);white-space:nowrap}
.badge.nach{background:var(--warn);color:oklch(25% .05 70)}
dl.money{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--secondary);font-size:14px}
dl.money div{display:flex;justify-content:space-between;gap:8px;padding:2px 0}
dl.money dt{color:var(--muted)} dl.money dd{margin:0;font-variant-numeric:tabular-nums;font-weight:600}
dl.money .sum{border-top:1px solid var(--border);margin-top:4px;padding-top:6px}
dl.money .sum dt,dl.money .sum dd{color:var(--fg);font-weight:700}
.progress{height:10px;border-radius:99px;background:var(--secondary);overflow:hidden;position:relative}
.progress i{position:absolute;inset:0 auto 0 0;background:var(--primary);border-radius:99px}
.progress i.n{background:var(--warn)}
.chart{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:130px;margin-top:10px}
.chart .c{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px}
.chart .c b{display:block;width:100%;border-radius:5px 5px 2px 2px;background:var(--primary);min-height:2px}
.chart .c b.zk{background:var(--c-zk)}
.chart .c span{font-size:10px;color:var(--muted);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;white-space:nowrap}
.legend i{flex:none;display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

/* Kalender */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wh{text-align:center;font-size:11px;font-weight:700;color:var(--muted);padding:2px 0}
.cd{position:relative;aspect-ratio:1/1.05;border-radius:10px;border:1.5px solid transparent;background:var(--secondary);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:600;font-size:15px;cursor:pointer;padding:0;user-select:none}
.cd.out{opacity:.28}
.cd.we{background:transparent;color:var(--muted)}
.cd.hol{background:repeating-linear-gradient(135deg,var(--secondary) 0 5px,var(--accent) 5px 10px);color:var(--muted)}
.cd.today{border-color:var(--fg)}
.cd.sel{outline:3px solid var(--primary);outline-offset:-1px}
.cd.inr{background:color-mix(in oklch,var(--primary) 22%,var(--card))}
.cd .m{font-size:9px;font-weight:700;line-height:1;margin-top:2px}
.cd.t-tarif{background:var(--c-tarif);color:#fff}.cd.t-zk{background:var(--c-zk);color:#fff}.cd.t-fza{background:var(--c-fza);color:#fff}.cd.t-tzug{background:var(--c-tzug);color:#fff}.cd.t-sonder{background:var(--c-sonder);color:#fff}
.cd.half{background-image:linear-gradient(135deg,transparent 50%,rgb(255 255 255/.55) 50%)}
.cd .w{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--primary)}
.tdot{display:inline-block;width:10px;height:10px;border-radius:3px;flex:none}
.tdot.tarif{background:var(--c-tarif)}.tdot.zk{background:var(--c-zk)}.tdot.fza{background:var(--c-fza)}.tdot.tzug{background:var(--c-tzug)}.tdot.sonder{background:var(--c-sonder)}
.bal{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.bal .b{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;box-shadow:var(--shadow);border-left:5px solid var(--border)}
.bal .b.tarif{border-left-color:var(--c-tarif)}.bal .b.zk{border-left-color:var(--c-zk)}.bal .b.fza{border-left-color:var(--c-fza)}.bal .b.tzug{border-left-color:var(--c-tzug)}.bal .b.sonder{border-left-color:var(--c-sonder)}
.bal .b.wide{grid-column:1/-1}
.bal .k{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.bal .v{font-family:var(--font-d);font-size:30px;line-height:1.05}
.bal .s{font-size:12px;color:var(--muted)}
.typepick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.typepick button{display:flex;align-items:center;gap:8px;text-align:left;border:1.5px solid var(--border);background:var(--card);border-radius:10px;padding:8px 10px;cursor:pointer;font-weight:600;font-size:14px}
.typepick button small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.typepick button[aria-pressed=true]{border-color:var(--primary);background:var(--accent)}
.list{display:grid;gap:2px}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:14px}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}

/* Netto */
.hero{text-align:center;padding:20px 16px}
.hero .v{font-family:var(--font-d);font-size:62px;line-height:.95;color:var(--primary)}
.hero .s{color:var(--muted);font-size:14px}
.blur{filter:blur(9px);user-select:none}
.split{display:flex;height:14px;border-radius:99px;overflow:hidden;margin-top:12px}
.split i{display:block;height:100%}

/* Einstellungen */
.set-sec summary h2{margin:0}
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.th{border:2px solid var(--border);border-radius:12px;padding:0;overflow:hidden;cursor:pointer;background:var(--card);text-align:left}
.th[aria-pressed=true]{border-color:var(--primary);box-shadow:0 0 0 3px color-mix(in oklch,var(--primary) 25%,transparent)}
.th .pv{height:58px;position:relative;overflow:hidden}
.th .nm{padding:6px 10px;font-weight:600;font-size:13.5px}
.sonderbox{border:1px solid var(--border);border-radius:10px;padding:10px;margin-bottom:8px;display:grid;gap:8px}
.hint{font-size:12.5px;color:var(--muted);margin-top:4px}

/* Navigation */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;padding:0 10px calc(8px + env(safe-area-inset-bottom));pointer-events:none}
nav.tabs .in{pointer-events:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;width:100%;max-width:480px;background:color-mix(in oklch,var(--card) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:20px;padding:6px;box-shadow:0 10px 30px -10px rgb(0 0 0/.3)}
nav.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current=page]{background:var(--accent);color:var(--fg)}

/* Dialog */
.scrim{position:fixed;inset:0;z-index:50;background:rgb(10 10 20/.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{width:100%;max-width:480px;max-height:88dvh;overflow:auto;background:var(--card);color:var(--fg);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .2s ease-out}
@media (min-width:600px){.scrim{align-items:center}.sheet{border-radius:20px}}
.sheet h3{font-family:var(--font-d);font-weight:400;font-size:30px;margin:0 0 10px}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(30px);opacity:.5}}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:up .2s}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
body[data-theme=arena] .empty,body[data-theme=xmas] .empty,body[data-theme=neon] .empty{color:rgb(255 255 255/.8)}

/* Themen-Deko */
body[data-theme=arena] .card,body[data-theme=arena] .amp,body[data-theme=arena] details.fold,body[data-theme=arena] .bal .b{border-top:4px solid var(--primary)}
body[data-theme=xmas] .card,body[data-theme=xmas] details.fold{margin-top:8px}
body[data-theme=xmas] .card::before,body[data-theme=xmas] details.fold::before{content:'';position:absolute;left:-2px;right:-2px;top:-9px;height:16px;border-radius:12px 12px 8px 8px;background:radial-gradient(14px 10px at 12% 100%,transparent 98%,#fff) ,#fff;
  -webkit-mask:radial-gradient(9px 7px at 8% 100%,#0000 96%,#000) 0 0/42px 100% repeat-x;mask:radial-gradient(9px 7px at 8% 100%,#0000 96%,#000) 0 0/42px 100% repeat-x;filter:drop-shadow(0 1px 1px rgb(80 110 160/.25));pointer-events:none}
body[data-theme=xmas] details.fold{position:relative}
body[data-theme=fryer] .card{background-image:radial-gradient(circle at 100% 0,color-mix(in oklch,var(--accent) 60%,transparent) 0 60px,transparent 61px)}

/* v1.1 */
.ibtn{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;background:transparent;color:var(--primary);font:700 11px/1 Georgia,serif;font-style:italic;cursor:pointer;vertical-align:1px;margin-left:4px;padding:0;text-transform:none}
.infotext{font-size:14.5px}.infotext ul{padding-left:18px;margin:6px 0}.infotext li{margin:5px 0}
.pill{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translate(-50%,-70px);z-index:70;background:var(--success);color:#fff;font-weight:700;font-size:13.5px;padding:7px 14px;border-radius:99px;box-shadow:var(--shadow);transition:transform .25s}
.pill.on{transform:translate(-50%,0)}
.toast.ok{background:var(--success);color:#fff}
.savebar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));z-index:5;margin:6px 0 14px;box-shadow:0 8px 20px -6px rgb(0 0 0/.35)}
.field.sm{height:40px;font-size:16px}
select.field.sm{background-position:calc(100% - 18px) 17px,calc(100% - 13px) 17px}
button.tile{border:0;cursor:pointer;font:inherit;color:inherit;width:100%}
button.tile:active{transform:scale(.97)}
.tile.on{background:var(--primary)}.tile.on .v,.tile.on .k{color:var(--on-primary)}
label.datebtn{cursor:pointer}
.zrows{display:grid;grid-template-columns:1fr;gap:5px;margin-top:8px}
.zr{display:flex;align-items:center;gap:10px;border-radius:10px;padding:6px 10px;font-weight:700;font-size:15px;white-space:nowrap;font-variant-numeric:tabular-nums}
.zr .grow{flex:1}.zr b{font-size:13px}
.zr .zb{font-size:11px;font-weight:800;padding:2px 7px;border-radius:99px;color:#fff}
.zr.z25{background:color-mix(in oklch,var(--warn) 22%,var(--card))}.zr.z25 .zb{background:color-mix(in oklch,var(--warn) 80%,#000)}
.zr.z50{background:color-mix(in oklch,var(--danger) 16%,var(--card))}.zr.z50 .zb{background:var(--danger)}
.zr.off{opacity:.45}
dl.money .hl25 dt,dl.money .hl25 dd{color:color-mix(in oklch,var(--warn) 55%,var(--fg));font-weight:700}
dl.money .hl50 dt,dl.money .hl50 dd{color:var(--danger);font-weight:700}
.morebtn{display:block;width:100%;margin-top:10px;border:1.5px dashed var(--border);background:transparent;border-radius:10px;padding:8px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer}
.anal{margin-top:12px;padding:12px;border-radius:12px;background:var(--secondary)}
.stats{margin-top:10px;gap:6px}.stats div{background:var(--card);border-radius:9px;padding:6px 8px}.stats span{display:block;font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}.stats b{font-family:var(--font-d);font-size:20px;font-weight:400}
.yearnav{gap:6px}.yearnav b{font-family:var(--font-d);font-size:26px;color:var(--onbg,var(--fg));min-width:56px;text-align:center}
.bal{grid-template-columns:1fr 1fr}
.bal .b{display:flex;flex-direction:column;min-height:112px}
.bal .b.all{border-left-color:var(--fg)}
.bal .tn{font-family:var(--font-d);font-size:22px;line-height:1;letter-spacing:.02em}
.bal .v{font-size:32px;margin-top:4px}.bal .v small{font-size:16px;color:var(--muted)}
.bal .s{display:flex;justify-content:space-between;gap:6px;margin-top:auto;padding-top:4px;align-items:flex-end}
.bal .s .side{font-size:11px;color:var(--muted);text-align:right;white-space:nowrap}
.cd.hd{background:linear-gradient(135deg,var(--secondary) 50%,var(--accent) 50%)}
.sumchips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.sc{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;background:color-mix(in oklch,var(--tc) 16%,var(--card));border:1.5px solid color-mix(in oklch,var(--tc) 45%,transparent);font-size:13px}
.sc b{font-family:var(--font-d);font-size:18px;font-weight:400}
.mhead{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.vrow{display:flex;align-items:center;gap:12px;padding:8px 10px 8px 8px;border-radius:12px;background:color-mix(in oklch,var(--tc) 8%,var(--card));border-left:5px solid var(--tc);margin-bottom:6px}

.dblock{flex:none;width:44px;text-align:center;border-radius:9px;background:var(--tc);color:#fff;padding:4px 0;line-height:1}
.dblock b{display:block;font-family:var(--font-d);font-size:24px;font-weight:400}.dblock span{font-size:10px;font-weight:800;letter-spacing:.06em}
.vt{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tname{font-weight:700}.vn{font-family:var(--font-d);font-size:20px;white-space:nowrap}
.vd{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.vx{font-size:12px;color:var(--muted);margin-top:2px}
.ybox{border:1.5px solid var(--border);border-radius:12px;padding:12px}
.del{width:30px;height:30px;border-radius:50%}

body[data-theme=dorf] #app{padding-bottom:calc(200px + env(safe-area-inset-bottom))}
.grid2>div{display:flex;flex-direction:column;min-width:0}
.grid2>div>.label{flex:1;display:flex;align-items:flex-end;gap:2px}

/* v1.2 */
.tdot.krank{background:var(--c-krank)}.cd.t-krank{background:var(--c-krank);color:#fff}.bal .b.krank{border-left-color:var(--c-krank)}
.kwcal{grid-template-columns:26px repeat(7,1fr)}
.kwc{display:grid;place-items:center;font-size:10.5px;font-weight:800;color:var(--muted);background:color-mix(in oklch,var(--secondary) 60%,transparent);border-radius:7px}
button.datebtn{width:100%;font:inherit;font-weight:600;color:var(--fg);cursor:pointer;text-align:left}
.field.big2{height:56px;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.kwr{font-family:var(--font-b);font-size:15px;font-weight:800;color:var(--fg);letter-spacing:0;margin-left:4px;vertical-align:3px}
.kpi.zkk{background:color-mix(in oklch,var(--c-zk) 14%,var(--card))}
.kpi.hl.nach{background:color-mix(in oklch,var(--warn) 28%,var(--card))}
.ygrid{display:grid;grid-template-columns:30px repeat(31,1fr);gap:2px;margin-top:10px;align-items:center}
.yh{font-size:8.5px;color:var(--muted);text-align:center;font-weight:700}
.ym{font-size:10px;font-weight:800;color:var(--muted);cursor:pointer;text-transform:uppercase}
.yc{display:block;aspect-ratio:1/1.35;border-radius:2px;background:var(--secondary)}
.yc.x{background:transparent}.yc.we{background:color-mix(in oklch,var(--secondary) 45%,transparent)}
.yc.hol{background:var(--accent)}
.yc.t-tarif{background:var(--c-tarif)}.yc.t-zk{background:var(--c-zk)}.yc.t-fza{background:var(--c-fza)}.yc.t-tzug{background:var(--c-tzug)}.yc.t-sonder{background:var(--c-sonder)}.yc.t-krank{background:var(--c-krank)}
.yc.half{opacity:.55}.yc.td{outline:1.5px solid var(--fg);outline-offset:0}
details.tgroup{border-radius:12px;border:1.5px solid color-mix(in oklch,var(--tc) 35%,var(--border));margin-top:10px;overflow:hidden}
details.tgroup summary{list-style:none;display:flex;align-items:center;gap:8px;padding:9px 12px;background:color-mix(in oklch,var(--tc) 10%,var(--card));cursor:pointer}
details.tgroup summary::-webkit-details-marker{display:none}
details.tgroup[open] summary .chev{transform:rotate(180deg)}
.tsum{font-family:var(--font-d);font-size:22px}
.tl{display:flex;align-items:center;gap:8px;padding:6px 12px;border-top:1px solid var(--border);font-size:14px}
.tl.past{opacity:.55}
.tlr{flex:1;min-width:0;font-weight:600}.tlr small{display:block;font-weight:500;color:var(--muted);font-size:11.5px}
.tln{font-family:var(--font-d);font-size:19px;font-weight:400;white-space:nowrap}
.bal .s{font-size:11.5px}
.grow{flex:1;min-width:0}
div.field.big2{font-size:19px;white-space:nowrap;overflow:hidden}
.kwr{white-space:nowrap}
.wk-head h3{line-height:1.1}

/* v1.3 */
.nsplit{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.nsplit>div{background:var(--secondary);border-radius:12px;padding:9px 11px;display:flex;flex-direction:column}
.nsplit>div.m{background:color-mix(in oklch,var(--success) 14%,var(--card))}
.nsplit span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.nsplit b{font-family:var(--font-d);font-size:26px;font-weight:400;line-height:1.1}
.nsplit small{font-size:11px;color:var(--muted)}
.mea-eur{color:var(--success);font-size:13px;text-transform:none;letter-spacing:0;font-weight:800}
.dim{opacity:.4}
.sumbox{margin-top:12px;padding:10px;border-radius:12px;border:1.5px dashed var(--border)}
.sumbox.man{border-style:solid;border-color:var(--warn);background:color-mix(in oklch,var(--warn) 8%,var(--card))}
.pvwrap{position:fixed;inset:0;z-index:80;background:rgb(10 10 20/.7);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px;opacity:0;transition:opacity .2s}
.pvwrap.on{opacity:1}
.pvbar{display:flex;justify-content:space-between;gap:10px;align-items:center;width:min(92vw,420px);background:var(--card);color:var(--fg);border-radius:12px;padding:8px 12px;font-size:14px;box-shadow:var(--shadow)}
.pvframe{width:min(92vw,420px);height:min(72vh,640px);border-radius:24px;overflow:hidden;border:3px solid var(--card);box-shadow:0 20px 50px -10px rgb(0 0 0/.5);position:relative;background:var(--bg)}
.pvfx{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.pvapp{position:relative}
.pvapp{transform:scale(.86);transform-origin:top center;padding:14px;pointer-events:none}
.pvfront{z-index:2}.pvfront>div{bottom:8px!important}

/* Cloud-Sync */
.top{position:relative}
.cloudbtn{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 10px;border-radius:99px;border:1.5px solid var(--border);background:var(--card);color:var(--fg);font-size:16px;cursor:pointer}
.syncdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--muted)}
.syncdot.ok,.syncdot.idle{background:var(--success)}.syncdot.busy{background:var(--warn);animation:pulse 1s infinite}.syncdot.err{background:var(--danger)}
@keyframes pulse{50%{opacity:.3}}

/* v1.5 */
.worked{flex-direction:column;justify-content:center;align-items:center;gap:0;background:color-mix(in oklch,var(--primary) 10%,var(--card));color:var(--fg);border:1.5px solid color-mix(in oklch,var(--primary) 30%,transparent);padding:10px 14px}
.worked .k{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.worked .v{font-size:44px;color:var(--primary);line-height:1.05}
.subh{font-size:13px;font-weight:800;margin:16px 0 8px;padding-top:12px;border-top:1px solid var(--border);color:var(--fg)}
.subh:first-child{margin-top:0;padding-top:0;border-top:0}
.field.calc{display:flex;align-items:center;background:var(--secondary);font-weight:700;border-style:dashed}
details.mini{margin:8px 0}
details.mini>summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--primary);list-style:none;padding:4px 0}
details.mini>summary::-webkit-details-marker{display:none}
details.mini>summary::before{content:'▸ ';}details.mini[open]>summary::before{content:'▾ ';}
.grid2.even>div>.label{min-height:34px}
.kstat{display:grid;gap:6px}
.kstat>div{display:flex;justify-content:space-between;align-items:baseline;padding:8px 12px;border-radius:10px;background:var(--secondary)}
.kstat span{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kstat b{font-family:var(--font-d);font-size:30px;font-weight:400;line-height:1}
.acc{color:var(--primary)}
.kpi{background:var(--secondary)}
.zus{margin-top:10px;border:1px solid var(--border);border-radius:10px;overflow:hidden;font-size:14px}
.zus .zr{display:grid;grid-template-columns:1fr 74px 92px;gap:8px;align-items:center;padding:7px 12px;border-radius:0;background:transparent;white-space:normal;font-weight:500}
.zus .zr+.zr{border-top:1px solid var(--border)}
.zus .zr b{font-weight:700;text-align:right}.zus .zr>span:last-child{text-align:right}
.zus .zr.sub{color:var(--muted);font-size:13px}.zus .zr.sub>span:first-child{padding-left:12px}
.zus .zr.tot{background:var(--secondary);font-weight:700}
.bal .b{min-height:120px;text-align:center;align-items:center;justify-content:space-between;padding:10px 10px 12px}
.bal .tn{font-family:var(--font-b);font-size:14px;font-weight:800;letter-spacing:.02em;display:flex;align-items:center;gap:6px;align-self:stretch;justify-content:center}
.bal .v{font-size:36px;margin:4px 0 2px}
.bal .s{display:block;font-size:12px;color:var(--muted);margin-top:0;padding-top:0}
.bal .side{font-size:11px;color:var(--muted);margin-top:2px}
.ysep{grid-column:1/-1;font-size:10.5px;font-weight:800;color:var(--muted);margin-top:8px;border-top:1px dashed var(--border);padding-top:6px}
.ym small{font-size:8px;margin-left:1px;opacity:.7}
.codebox{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border-radius:12px;background:var(--secondary);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;font-weight:700;letter-spacing:.04em}
.steps{display:grid;gap:12px;margin-top:10px}
.steps>div{display:flex;gap:10px;align-items:flex-start}
.sn{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--primary);color:var(--on-primary);font-weight:800;font-size:13px}
dl.money dt small{display:block;font-size:11px;font-weight:500;color:var(--muted)}
dl.money .grp{margin-top:6px;padding-top:6px;border-top:1px solid var(--border)}
dl.money .grp:first-child{margin-top:0;padding-top:2px;border-top:0}
dl.money .grp dt,dl.money .grp dd{color:var(--fg);font-weight:800}
dl.money dd{white-space:nowrap}
dl.money .hl25 dt,dl.money .hl25 dd{color:var(--fg);font-weight:700}
.grid3>div{display:flex;flex-direction:column;min-width:0}
.grid3>div>.label{flex:1;display:flex;align-items:flex-end}

/* Splash */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#17181c;animation:sp-out .32s ease-in 1.18s forwards;pointer-events:none}
#splash.dark{background:#141519}
#splash .sp-in{display:flex;flex-direction:column;align-items:center;gap:14px}
.sp-logo{overflow:visible;filter:drop-shadow(0 10px 22px rgb(29 118 80/.35));animation:sp-pop .5s cubic-bezier(.2,1.4,.4,1) both}
.sp-bar{transform-box:fill-box;transform-origin:50% 0;animation:sp-drop .34s cubic-bezier(.3,1.5,.5,1) .2s both}
.sp-stem{transform-box:fill-box;transform-origin:50% 0;animation:sp-grow .32s ease-out .38s both}
.sp-shine{animation:sp-shine .6s ease-in-out .62s both}
.sp-word{font-family:'Bebas Neue',Impact,sans-serif;font-size:30px;color:#2a9c6b;letter-spacing:.32em;padding-left:.32em;animation:sp-word .45s ease-out .5s both}
.sp-line{width:84px;height:3px;border-radius:3px;background:rgb(42 156 107/.18);overflow:hidden}
.sp-line i{display:block;height:100%;width:100%;background:#2a9c6b;border-radius:3px;transform-origin:0 50%;animation:sp-load .9s cubic-bezier(.6,0,.2,1) .3s both}
@keyframes sp-pop{from{opacity:0;transform:scale(.55) rotate(-8deg)}to{opacity:1;transform:none}}
@keyframes sp-drop{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}
@keyframes sp-grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes sp-shine{from{transform:skewX(-18deg) translateX(0)}to{transform:skewX(-18deg) translateX(150px)}}
@keyframes sp-word{from{opacity:0;letter-spacing:.8em;padding-left:.8em}to{opacity:1;letter-spacing:.32em;padding-left:.32em}}
@keyframes sp-load{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sp-out{to{opacity:0;transform:scale(1.04);visibility:hidden}}
@media (prefers-reduced-motion: reduce){#splash *{animation:none!important}#splash{animation:sp-out .2s ease-in .5s forwards}}

/* Kompakte Kontingent-Karte */
.kcard{padding:10px 14px}
.krow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.krow b{font-family:var(--font-d);font-size:22px;font-weight:400}
.iconbtn.sm{width:32px;height:32px}.iconbtn.sm svg{width:16px;height:16px}
.kline{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:14px}
.kline>span,.kline>label{flex:1;font-weight:700;color:var(--muted);font-size:12px;letter-spacing:.05em;text-transform:uppercase}
.kline b{font-family:var(--font-d);font-size:24px;font-weight:400}
.kline .field.sm{width:96px;height:36px;font-size:16px}
.kedit{border:0;background:transparent;color:var(--muted);font-size:16px;cursor:pointer;padding:2px 4px}
.kmini{display:flex;justify-content:space-between;margin-top:6px;font-size:13px;color:var(--muted)}
.kmini b{font-family:var(--font-d);font-size:22px;font-weight:400;color:var(--fg);margin-left:4px}
.kmini b.acc{color:var(--primary)}
.progress.thin{height:6px;margin-top:6px}

/* v1.7 – Kopf mit Zahnrad, Abschnitte schließen, Gehalt-Umschalter */
.gearbtn svg{width:20px;height:20px}
.gearbtn.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
nav.tabs .in{grid-template-columns:repeat(4,1fr)}
.secfoot{display:flex;justify-content:flex-end;margin-top:12px}
.secclose{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;border:1.5px solid var(--border);background:var(--secondary);color:var(--muted);cursor:pointer}
.set-sec summary h2{display:flex;align-items:center;gap:6px}
.gmode{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-2px 0 10px}
.gmode>span{flex:1;line-height:1.25}
.seg.mini{flex:none;padding:3px;border-radius:10px}
.seg.mini button{height:30px;padding:0 10px;font-size:13px}
/* Jahresüberblick: Mini-Kalender */
.ymonths{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.ymon{border:1px solid var(--border);border-radius:10px;padding:6px 6px 7px;background:var(--card);text-align:left;cursor:pointer;font:inherit;color:inherit}
.ymon.has{border-color:color-mix(in oklch,var(--primary) 45%,var(--border))}
.ymh{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 4px}
.ymh b{font-size:12px;text-transform:uppercase;letter-spacing:.04em}.ymh span{font-size:11px;font-weight:800;color:var(--primary)}
.ydays{display:grid;grid-template-columns:repeat(7,1fr);gap:1px}
.ydays i{font-style:normal;font-size:8.5px;line-height:13px;height:13px;text-align:center;border-radius:3px;color:var(--muted);font-variant-numeric:tabular-nums}
.ydays i.we{opacity:.45}.ydays i.hol{background:var(--accent);color:var(--fg)}
.ydays i[class*="t-"]{color:#fff;font-weight:800}
.ydays i.t-tarif{background:var(--c-tarif)}.ydays i.t-zk{background:var(--c-zk)}.ydays i.t-fza{background:var(--c-fza)}.ydays i.t-tzug{background:var(--c-tzug)}.ydays i.t-sonder{background:var(--c-sonder)}.ydays i.t-krank{background:var(--c-krank)}
.ydays i.half{background-image:linear-gradient(135deg,transparent 50%,rgb(255 255 255/.5) 50%)}
.ydays i.td{outline:1.5px solid var(--fg);outline-offset:-1px;color:var(--fg);font-weight:800}
.ymonths .ysep{grid-column:1/-1}

/* ===== PC / großer Bildschirm (Handy-Ansicht bleibt unverändert) ===== */
@media (min-width: 1000px) {
  #app { max-width: 1120px; padding: 28px 28px 60px; }
  .top { margin-bottom: 18px; }
  .brand img { width: 40px; height: 40px; }
  h1 { font-size: 56px; }
  .page { column-count: 2; column-gap: 22px; }
  .page > * { break-inside: avoid; }
  .page > .between, .page > h1, .page > .seg, .page > .ampel, .page > .gmode, .page > .bal, .page > .notice, .page > p { column-span: all; }
  .page > .card, .page > details.fold { display: inline-block; width: 100%; }
  .ampel { grid-template-columns: repeat(3, minmax(0, 260px)); }
  .bal { grid-template-columns: repeat(6, 1fr); }
  .ymonths { grid-template-columns: repeat(4, 1fr); }
  .ydays i { font-size: 9.5px; line-height: 15px; height: 15px; }
  .seg { max-width: 520px; }
  /* Navigation bleibt unten, etwas breiter */
  nav.tabs .in { max-width: 560px; }
  body[data-theme=schrank] #app, body[data-theme=dorf] #app { padding-bottom: 200px; }
}
@media (min-width: 1400px) {
  #app { max-width: 1240px; }
}
.anal svg{max-width:560px;display:block;margin:0 auto}

/* Sync: QR-Code */
.qrbox{margin-top:10px;text-align:center}
.qrbox .qr{display:inline-block;padding:10px;background:#fff;border-radius:14px;box-shadow:var(--shadow);line-height:0}
.qrbox .qr svg{width:200px;height:200px}

/* ===== PC: Reiter Feierabend ===== */
@media (min-width: 1000px) {
  .page-feierabend { column-count: 1 !important; max-width: 1040px; margin: 0 auto; }
  .page-feierabend .ampel { grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 20px; }
  .page-feierabend .amp { padding: 14px 18px; border-radius: 16px; }
  .page-feierabend .amp .k { font-size: 11px; }
  .page-feierabend .amp .v { font-size: 36px; }
  .fa-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 22px; align-items: stretch; }
  .fa-l, .fa-r { display: flex; flex-direction: column; gap: 18px; }
  .fa-l .card, .fa-r .card { margin: 0; padding: 24px; border-radius: 20px; }
  .fa-l .card { flex: 1; }
  .page-feierabend .datebtn { height: 54px; font-size: 18px; }
  .page-feierabend .field.big { height: 92px; font-size: 56px; border-radius: 14px; }
  .page-feierabend .worked { margin-top: 18px; padding: 18px; border-radius: 16px; }
  .page-feierabend .worked .v { font-size: 72px; }
  .page-feierabend #fa-live .btn { height: 54px; font-size: 17px; border-radius: 14px; }
  .fa-r .card { flex: 1; }
  .fa-r h2 { font-size: 14px; margin-bottom: 14px; }
  .fa-r .tiles { grid-template-columns: 1fr 1fr; gap: 14px; }
  .fa-r .tile { padding: 20px 10px; border-radius: 16px; }
  .fa-r .tile .k { font-size: 14px; }
  .fa-r .tile .v { font-size: 52px; }
  .fa-r .tile.single { grid-column: 1 / -1; }
  .fa-r details.fold { margin: 0; border-radius: 16px; }
  .fa-r details.fold summary { padding: 16px 20px; font-size: 15px; }
}
@media (min-width: 1000px) {
  #app { padding-bottom: 130px; }
  .fa-r .card { display: flex; flex-direction: column; }
  .fa-r .tiles { flex: 1; align-content: center; }
}
@media (min-width: 1000px) { #app:has(.page-feierabend) .top { max-width: 1040px; margin-left: auto; margin-right: auto; } }

/* Kurzarbeit */
:root{--c-kurz:oklch(58% .06 230)}
.tdot.kurz{background:var(--c-kurz)}.cd.t-kurz{background:var(--c-kurz);color:#fff}.bal .b.kurz{border-left-color:var(--c-kurz)}
.yc.t-kurz,.ydays i.t-kurz{background:var(--c-kurz)}
/* Gehalt: aufklappbare Mehrarbeit */
dl.money details.mline>summary{display:flex;justify-content:space-between;gap:8px;padding:2px 0;cursor:pointer;list-style:none}
dl.money details.mline>summary::-webkit-details-marker{display:none}
dl.money details.mline .chev{display:inline-block;font-size:11px;transition:transform .15s}
dl.money details.mline[open] .chev{transform:rotate(180deg)}
dl.money details.mline.hl25>summary dt,dl.money details.mline.hl25>summary dd{color:var(--fg);font-weight:700}
dl.money .msub{margin:2px 0 6px 4px;padding:4px 0 4px 10px;border-left:2px solid var(--border);font-size:13px}
dl.money .msub .mav{margin-top:4px;padding-top:6px;border-top:1px dashed var(--border)}
/* Demo-Modus */
.demobar{position:sticky;top:0;z-index:50;margin:0 -14px 8px;padding:8px 14px;background:repeating-linear-gradient(135deg,#f5b400 0 14px,#e0a200 14px 28px);color:#1b1500;font-weight:800;font-size:13px;letter-spacing:.04em;display:flex;align-items:center;justify-content:space-between;gap:8px}
.demobar button{border:0;border-radius:8px;padding:5px 10px;background:#1b1500;color:#fff;font-weight:700;font-size:12px;cursor:pointer}
.btn.big{min-height:56px;font-size:17px;width:100%}

/* Seiten nie seitlich verschiebbar */
#app,.page{max-width:100%}
#app{overflow-x:clip}
.sheet{overflow-x:hidden}
/* Demo-Link & Release Notes */
.demolink{border:0;background:none;color:var(--onbg,var(--muted));opacity:.45;font-size:11px;letter-spacing:.08em;cursor:pointer;padding:4px 10px}
.rel{display:grid;gap:10px}
.relv{border-left:3px solid var(--primary);padding:2px 0 2px 10px}
.relh{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.relh b{font-size:16px}.relh span{font-size:12px;color:var(--muted)}
.relv ul{margin:4px 0 0;padding-left:18px;font-size:13.5px}

/* =====================================================================
   Design „Bold Pop“ – knallig, fett, geometrisch, asymmetrisch
   ===================================================================== */
body[data-theme=pop]{
  --bg:#fff1cf;--card:#fff;--fg:#121212;--muted:#4a4656;--primary:#ff2e88;--on-primary:#fff;--secondary:#ffe36e;--accent:#b8f2e6;
  --border:#121212;--success:#00a86b;--danger:#ff3b30;--warn:#ff9f1c;--c-zk:#2d5bff;--c-tarif:#ff7a00;--c-fza:#8b5cf6;--c-tzug:#00b3a4;--c-sonder:#ff2e88;
  --radius:24px;--shadow:5px 5px 0 #121212;--onbg:#121212;
  --font-d:'Toki Bricolage XB','Arial Black',sans-serif;--font-b:'Toki Bricolage',system-ui,sans-serif;--font-pop:'Toki Archivo','Arial Black',Impact,sans-serif;
  font-weight:600;
}
body[data-theme=pop] h1{font-family:var(--font-pop);display:inline-block;font-size:clamp(28px,9vw,40px);line-height:.92;text-transform:uppercase;letter-spacing:-.02em;transform:rotate(-2deg);transform-origin:left;background:linear-gradient(transparent 58%,#ffe36e 58% 92%,transparent 92%);padding:0 6px 0 2px;margin-bottom:18px}
body[data-theme=pop] .brand span{font-family:var(--font-pop);font-size:24px;letter-spacing:.06em;color:#121212}
body[data-theme=pop] .brand img{border:3px solid #121212;border-radius:12px;box-shadow:3px 3px 0 #121212}
body[data-theme=pop] .iconbtn{border:3px solid #121212;background:#fff;box-shadow:3px 3px 0 #121212}
body[data-theme=pop] .card,body[data-theme=pop] details.fold{border:3px solid #121212;box-shadow:6px 6px 0 #121212;border-radius:28px 10px 28px 10px}
body[data-theme=pop] .card:nth-of-type(even),body[data-theme=pop] details.fold:nth-of-type(even){border-radius:10px 28px 10px 28px;box-shadow:-6px 6px 0 #121212;margin-left:6px}
body[data-theme=pop] .card:nth-of-type(odd){margin-right:6px}
body[data-theme=pop] .card::after{content:'';position:absolute;top:-11px;right:22px;width:22px;height:22px;background:#2d5bff;border:3px solid #121212;border-radius:50%}
body[data-theme=pop] .card:nth-of-type(3n)::after{border-radius:4px;background:#ffe36e;transform:rotate(45deg)}
body[data-theme=pop] .card:nth-of-type(3n+1)::after{background:#ff2e88;border-radius:0;clip-path:polygon(50% 0,100% 100%,0 100%);border:0;width:26px;height:24px}
body[data-theme=pop] .card h2{display:inline-block;background:#121212;color:#fff;font-family:var(--font-pop);font-weight:400;font-size:13px;letter-spacing:.06em;padding:5px 11px 4px;border-radius:999px;transform:rotate(-1.5deg)}
body[data-theme=pop] .card h3,body[data-theme=pop] .sheet h3{font-family:var(--font-pop);font-size:clamp(20px,6.4vw,27px);text-transform:uppercase;letter-spacing:-.01em}
body[data-theme=pop] .label{color:#121212;font-weight:800}
body[data-theme=pop] .field,body[data-theme=pop] .datebtn{border:3px solid #121212;border-radius:14px;font-weight:700;background:#fff}
body[data-theme=pop] .field:focus{border-color:#121212;box-shadow:4px 4px 0 var(--primary)}
body[data-theme=pop] .btn{border:3px solid #121212;border-radius:16px;box-shadow:4px 4px 0 #121212;font-family:var(--font-pop);font-weight:400;text-transform:uppercase;letter-spacing:.03em;font-size:15px;transition:transform .08s,box-shadow .08s}
body[data-theme=pop] .btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #121212}
body[data-theme=pop] .btn.soft{background:#ffe36e;color:#121212}
body[data-theme=pop] .btn.ghost{background:#fff;color:#121212;border-color:#121212}
body[data-theme=pop] .btn.danger{background:#fff;color:#ff3b30;border-color:#121212}
body[data-theme=pop] .seg{background:#121212;border-radius:18px;padding:5px}
body[data-theme=pop] .seg button{color:#fff;font-family:var(--font-pop);font-weight:400;text-transform:uppercase;font-size:13px;letter-spacing:.03em}
body[data-theme=pop] .seg button[aria-pressed=true]{background:#ffe36e;color:#121212;box-shadow:none;transform:rotate(-1deg)}
body[data-theme=pop] .switch input{border:2.5px solid #121212;background:#fff}
body[data-theme=pop] .switch input::after{top:1.5px;left:1.5px;background:#121212;box-shadow:none}
body[data-theme=pop] .switch input:checked{background:#00d18b}body[data-theme=pop] .switch input:checked::after{left:19.5px;background:#fff;border:2px solid #121212}
body[data-theme=pop] .amp{border:3px solid #121212;box-shadow:4px 4px 0 #121212;border-radius:18px 6px 18px 6px}
body[data-theme=pop] .amp:nth-child(1){background:#ffb3d1;transform:rotate(-1.5deg)}
body[data-theme=pop] .amp:nth-child(2){background:#a8c5ff;transform:rotate(1deg)}
body[data-theme=pop] .amp:nth-child(3){background:#b8f2e6;transform:rotate(-.6deg)}
body[data-theme=pop] .amp .k{color:#121212}
body[data-theme=pop] .worked{background:#2d5bff;color:#fff;border:3px solid #121212;box-shadow:5px 5px 0 #121212;border-radius:22px 8px 22px 8px}
body[data-theme=pop] .worked .v{color:#fff;font-size:52px;text-shadow:3px 3px 0 #121212}
body[data-theme=pop] .worked .k{color:#fff}
body[data-theme=pop] .tile{background:#ffe36e;border:2.5px solid #121212;border-radius:14px}
body[data-theme=pop] .tile:nth-child(even){background:#b8f2e6}
body[data-theme=pop] .tile .v{color:#121212}
body[data-theme=pop] .kpi{border:2.5px solid #121212;background:#fff}
body[data-theme=pop] .kpi.hl{background:#b8f2e6}
body[data-theme=pop] .big-r,body[data-theme=pop] .hero .v{color:var(--primary);text-shadow:3px 3px 0 #121212}
body[data-theme=pop] dl.money{background:#fff8e1;border:2.5px solid #121212;border-radius:16px}
body[data-theme=pop] .progress{height:16px;border:2.5px solid #121212;background:#fff}
body[data-theme=pop] .progress i{background:repeating-linear-gradient(-45deg,#ff2e88 0 8px,#ff5fa5 8px 16px);border-radius:0}
body[data-theme=pop] .chart .c b{border:2px solid #121212;background:#ff2e88}

/* Kontingent: Zahl groß in der Mitte, Geleistet/Offen daneben */
.ktrio{display:grid;grid-template-columns:1fr 1.25fr 1fr;align-items:end;gap:6px;margin-top:10px;text-align:center}
.ktrio>div,.ktrio .mid{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.ktrio span{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.ktrio b{font-family:var(--font-d);font-weight:400;font-size:clamp(21px,6.4vw,27px);line-height:1.05;white-space:nowrap}
.ktrio b.acc{color:var(--primary)}
.ktrio .mid{border:0;background:var(--secondary);border-radius:14px;padding:8px 4px 6px;cursor:pointer;color:var(--fg)}
.ktrio .mid b{font-size:clamp(30px,9.5vw,40px)}
/* Schließen-X in jedem Fenster */
.sheet{position:relative}
.sheetx{position:sticky;top:0;float:right;z-index:3;margin:-6px -4px 0 8px;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border);background:var(--card);color:var(--fg);font-size:17px;line-height:1;cursor:pointer;display:grid;place-items:center}
/* Jahres-Statistik */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--secondary);border:1px solid var(--border);border-radius:12px;padding:8px 10px;min-width:0}
.stat .si{font-size:14px;margin-right:5px}
.stat .sk{display:flex;align-items:center;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.stat .sv{font-family:var(--font-d);font-size:21px;line-height:1.1}
.stat .ss{font-size:11.5px;color:var(--muted);line-height:1.25}
/* Urlaub: kompakte Kacheln (3 je Reihe) */
.bal{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.bal .b{min-height:0;padding:7px 5px 8px;border-radius:11px}
.bal .tn{font-size:11.5px;gap:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bal .v{font-size:clamp(19px,6vw,24px);margin:2px 0 1px;white-space:nowrap}
.bal .v small{font-size:11px}
.bal .s{font-size:10.5px;line-height:1.2}
.bal .side{font-size:10px;line-height:1.2}
.bal .tdot{width:7px;height:7px}

body[data-theme=light],body[data-theme=gold],body[data-theme=eco]{--font-d:'Toki Oswald','Arial Narrow',Impact,sans-serif;--font-b:'Toki Manrope',system-ui,-apple-system,sans-serif;--radius:18px}
body:is([data-theme=light],[data-theme=gold],[data-theme=eco]) .card,body:is([data-theme=light],[data-theme=gold],[data-theme=eco]) details.fold{border-radius:20px}
body:is([data-theme=light],[data-theme=gold],[data-theme=eco]) .btn{border-radius:14px;font-weight:800}
body:is([data-theme=light],[data-theme=gold],[data-theme=eco]) .worked .v{font-size:46px}
body:is([data-theme=light],[data-theme=gold],[data-theme=eco]) .amp,body:is([data-theme=light],[data-theme=gold],[data-theme=eco]) .tile{border-radius:14px}

/* ---------- Light Mode: hell, klar, grüner Akzent ---------- */
body[data-theme=light]{color-scheme:light;--bg:#eef2f0;--card:#fff;--fg:#1c2420;--muted:#66716b;--primary:#2fae78;--on-primary:#fff;--secondary:#f2f5f3;--accent:#d9f1e4;--border:#e2e8e4;--success:#23955f;--danger:#e0483e;--warn:#e9a23b;--onbg:#1c2420;
  --shadow:0 1px 2px rgb(20 40 30/.04),0 10px 26px -14px rgb(20 40 30/.22)}
body[data-theme=light] .card,body[data-theme=light] details.fold{border:1px solid #e6ebe8}
body[data-theme=light] .field,body[data-theme=light] .datebtn{background:#f3f6f4;border-color:#e0e6e2}
body[data-theme=light] .worked{background:#f3f6f4;border:1px solid #e0e6e2}
body[data-theme=light] .worked .v,body[data-theme=light] .tile .v,body[data-theme=light] .big-r{color:var(--primary)}
body[data-theme=light] .amp{background:#fff;border:1px solid #e2e8e4;box-shadow:var(--shadow)}
body[data-theme=light] .tile{background:#f3f6f4;border:1px solid #e3e9e5}
body[data-theme=light] nav.tabs .in{background:#fff;border:1px solid #e3e9e5;box-shadow:0 -2px 18px -8px rgb(20 40 30/.2);border-radius:22px}
body[data-theme=light] nav.tabs button[aria-current=page]{background:#d9f1e4;color:#1f7a52}

/* ---------- Premium Dark & Gold ---------- */
body[data-theme=gold]{color-scheme:dark;--bg:#0b0b0c;--card:#151516;--fg:#f1ece1;--muted:#a39d90;--primary:#d4af5f;--on-primary:#1a1407;--secondary:#1d1c1a;--accent:#2a2519;--border:rgb(212 175 95/.26);--success:#9fcf8a;--danger:#ff7a6b;--warn:#e9c46a;--onbg:#f1ece1;
  --c-zk:#d4af5f;--shadow:0 0 0 1px rgb(212 175 95/.08),0 14px 30px -14px rgb(0 0 0/.8)}
body[data-theme=gold] .card,body[data-theme=gold] details.fold{border:1px solid rgb(212 175 95/.28);background:linear-gradient(180deg,#19191a,#121213)}
body[data-theme=gold] .field,body[data-theme=gold] .datebtn{background:#101011;border-color:rgb(212 175 95/.3);color:#f1ece1}
body[data-theme=gold] .field.big,body[data-theme=gold] .worked .v,body[data-theme=gold] .tile .v,body[data-theme=gold] .amp .v,body[data-theme=gold] .big-r,body[data-theme=gold] .hero .v,body[data-theme=gold] .kpi .v{color:#e0bd6c}
body[data-theme=gold] .worked{background:#101011;border:1px solid rgb(212 175 95/.4)}
body[data-theme=gold] .amp,body[data-theme=gold] .tile{background:#121213;border:1px solid rgb(212 175 95/.25)}
body[data-theme=gold] .btn:not(.ghost):not(.soft):not(.danger){background:linear-gradient(100deg,#8f6d2c,#e6c97f 45%,#b28a3d 75%,#8f6d2c);color:#1a1407;border:0;text-shadow:0 1px 0 rgb(255 255 255/.25)}
body[data-theme=gold] .btn.soft{background:#2a2519;color:#e0bd6c}
body[data-theme=gold] .btn.ghost{border-color:rgb(212 175 95/.4);color:#e0bd6c}
body[data-theme=gold] .seg{background:#101011;border:1px solid rgb(212 175 95/.25)}
body[data-theme=gold] .seg button[aria-pressed=true]{background:#2a2519;color:#e6c97f}
body[data-theme=gold] .brand span,body[data-theme=gold] h1{color:#f1ece1}
body[data-theme=gold] .progress i{background:linear-gradient(90deg,#8f6d2c,#e6c97f)}
body[data-theme=gold] nav.tabs .in{background:rgb(18 18 19/.92);border:1px solid rgb(212 175 95/.3);border-radius:22px}
body[data-theme=gold] nav.tabs button{color:#a39d90}
body[data-theme=gold] nav.tabs button[aria-current=page]{background:#1f2a22;color:#e6c97f;box-shadow:inset 0 0 0 1px rgb(212 175 95/.25)}

/* ---------- Natur & Eco (Erdtöne) ---------- */
body[data-theme=eco]{color-scheme:light;--bg:#ebe2ce;--card:rgb(232 222 199/.88);--fg:#2f2a21;--muted:#6f6654;--primary:#2f5a3d;--on-primary:#f4eedf;--secondary:#dccfb2;--accent:#c7d3bb;--border:#cfc1a1;--success:#3d7a4c;--danger:#b4472f;--warn:#b57b25;--onbg:#2f2a21;
  --c-zk:#5d7f62;--c-tarif:#b5793a;--shadow:0 1px 2px rgb(60 45 20/.06),0 12px 28px -16px rgb(60 45 20/.35)}
body[data-theme=eco] .card,body[data-theme=eco] details.fold{border:1px solid #d6c9aa;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
body[data-theme=eco] .field,body[data-theme=eco] .datebtn{background:#e0d4b9;border-color:#cdbf9f}
body[data-theme=eco] .field.big{background:#d8cbae}
body[data-theme=eco] .worked{background:#3d6b4a;border:0;color:#e9e3d0}
body[data-theme=eco] .worked .v{color:#cfe0c4}body[data-theme=eco] .worked .k{color:#d7e3cc}
body[data-theme=eco] .amp{background:rgb(214 203 177/.9);border:1px solid #cdbf9f}
body[data-theme=eco] .tile{background:#ddd0b3;border:1px solid #cdbf9f}
body[data-theme=eco] .tile .v{color:#2f2a21}
body[data-theme=eco] .btn:not(.ghost):not(.soft):not(.danger){background:#28452f;color:#f1ead8}
body[data-theme=eco] .seg{background:#d8cbae}
body[data-theme=eco] .seg button[aria-pressed=true]{background:#5b4130;color:#f4eedf}
body[data-theme=eco] nav.tabs .in{background:rgb(226 214 188/.94);border:1px solid #cdbf9f;border-radius:20px}
body[data-theme=eco] nav.tabs button{color:#5c5343}
body[data-theme=eco] nav.tabs button[aria-current=page]{background:#5b4130;color:#f4eedf}
/* Theme-Probe-Leiste */
.trybar{position:sticky;top:0;z-index:49;margin:0 -14px 8px;padding:7px 14px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;font-weight:700;box-shadow:var(--shadow)}
.trybar .bb{display:flex;gap:6px}.trybar button{border:1px solid var(--border);border-radius:10px;padding:5px 9px;font-weight:800;font-size:12px;background:var(--secondary);color:var(--fg);cursor:pointer}
.trybar button.go{background:var(--primary);color:var(--on-primary);border-color:transparent}
/* Hochgeladene Dokumente je Monat */
.docs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:0 0 12px}
.doc{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--secondary);color:var(--muted);opacity:.6;border:1px dashed var(--border)}
.doc.on{opacity:1;color:var(--fg);background:var(--accent);border-style:solid}
.docs.mini{margin:0;gap:3px}.docs.mini .doc{padding:1px 4px;font-size:11px}
.docup{position:relative;font-size:12px;font-weight:800;padding:4px 10px;border-radius:999px;border:1px solid var(--primary);color:var(--primary);cursor:pointer;background:var(--card)}
.docup input{position:absolute;inset:0;opacity:0;width:100%}
.slipcard summary b{font-family:var(--font-d);font-weight:400;font-size:20px}
table.vgl{width:100%;border-collapse:collapse;font-size:13px;margin-top:10px}
table.vgl th{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:right;padding:4px 3px;font-weight:700}
table.vgl th:first-child,table.vgl td:first-child{text-align:left}
table.vgl td{padding:6px 3px;border-top:1px solid var(--border);text-align:right;white-space:nowrap}
table.vgl td:first-child{white-space:normal}
/* Gehalt Jahr */
.gjlist{display:grid;gap:6px}
.gjrow{display:grid;grid-template-columns:1.1fr 1fr 1fr;align-items:center;gap:6px;border:1px solid var(--border);background:var(--card);border-radius:12px;padding:8px 10px;text-align:left;cursor:pointer;color:var(--fg);font:inherit}
.gjrow.prog{opacity:.6}
.gjrow .gm{display:flex;flex-direction:column;gap:2px}.gjrow .gm b{font-size:15px}
.gjrow .gv{display:flex;flex-direction:column;align-items:flex-end}.gjrow .gv small{font-size:10.5px;color:var(--muted)}
.gjrow .gv b{font-family:var(--font-d);font-weight:400;font-size:19px}
.stkh{margin:14px 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
/* Mehrarbeit-Aufklapper: Werte untereinander */
dl.money .msub>div{display:flex;flex-direction:column;align-items:flex-start;gap:0;padding:5px 0;border-bottom:1px dashed var(--border)}
dl.money .msub>div:last-child{border-bottom:0}
dl.money .msub dt{font-size:12.5px;color:var(--muted)}
dl.money .msub dd{font-size:15px;font-weight:700;margin:0}
/* Netto Grundgehalt / Mehrarbeit größer */
.nsplit b{font-size:clamp(22px,7vw,28px)}
/* Urlaub-Kacheln: größere Schrift */
.bal .tn{font-size:13.5px}
.bal .v{font-size:clamp(25px,7.6vw,31px)}
.bal .v small{font-size:13px}
/* Gehalt: Dokumente & Export */
.mhead{display:flex;flex-direction:column;align-items:center;gap:2px}
.doccard h2{margin-bottom:6px}
.docrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--border);font-size:14px;font-weight:600}
.docrow>span:first-child{flex:1}
.dstate{font-size:12px;color:var(--muted)}.dstate.ok{color:var(--success);font-weight:700}
.exportmini{display:flex;align-items:center;justify-content:center;gap:8px;margin:4px 0 12px;font-size:12px;color:var(--onbg,var(--muted));opacity:.85}
.exportmini .btn.sm{height:30px;min-height:30px;padding:0 12px;font-size:12px;width:auto}

body[data-theme=noel] #app{padding-top:calc(env(safe-area-inset-top) + 48px)}
body[data-theme=noel] h1{font-family:'Toki PlayfairI',Georgia,serif;font-weight:400;font-size:46px;letter-spacing:0;color:#f3e2b0;text-shadow:0 2px 18px rgb(217 180 94/.35)}
body[data-theme=noel] h1::after{content:'✦';font-size:.42em;margin-left:8px;color:#d9b45e;vertical-align:super}
body[data-theme=noel] .brand span{font-family:var(--font-d);letter-spacing:.14em;color:#f3e2b0}
body[data-theme=noel] .card,body[data-theme=noel] details.fold{border:1px solid rgb(217 180 94/.32);background:linear-gradient(160deg,rgb(16 46 32/.92),rgb(6 22 15/.92));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);position:relative;overflow:hidden}
body[data-theme=noel] .card::before{content:'';position:absolute;top:0;right:22px;width:14px;height:100%;background:linear-gradient(90deg,rgb(179 32 47/.0),rgb(179 32 47/.55) 30% 70%,rgb(179 32 47/0));opacity:.55;pointer-events:none}
body[data-theme=noel] .card:nth-of-type(odd)::before{right:auto;left:22px;background:linear-gradient(90deg,rgb(217 180 94/0),rgb(217 180 94/.35) 30% 70%,rgb(217 180 94/0))}
body[data-theme=noel] .card>*{position:relative}
body[data-theme=noel] .card h2{font-family:'Toki PlayfairI',Georgia,serif;font-weight:400;font-size:19px;text-transform:none;letter-spacing:.01em;color:#e6c97f}
body[data-theme=noel] .card h3,body[data-theme=noel] .sheet h3{font-family:'Toki PlayfairI',Georgia,serif;font-weight:400;color:#f3e2b0}
body[data-theme=noel] .field,body[data-theme=noel] .datebtn{background:rgb(0 0 0/.28);border-color:rgb(217 180 94/.32);color:#f6ecd6}
body[data-theme=noel] .worked{background:radial-gradient(120% 140% at 50% 0,rgb(179 32 47/.55),rgb(70 10 18/.75));border:1px solid rgb(217 180 94/.45)}
body[data-theme=noel] .worked .v,body[data-theme=noel] .tile .v,body[data-theme=noel] .amp .v,body[data-theme=noel] .big-r,body[data-theme=noel] .hero .v,body[data-theme=noel] .kpi .v,body[data-theme=noel] .bal .v,body[data-theme=noel] .ktrio b,body[data-theme=noel] .field.big{color:#f0d48a}
body[data-theme=noel] .worked .k{color:#f6dcdc}

body[data-theme=noel] .btn:not(.ghost):not(.soft):not(.danger){background:linear-gradient(100deg,#8a6a2a,#e8cd86 45%,#b38c3e 75%,#8a6a2a);color:#1c1306;border:0;font-weight:800;letter-spacing:.02em}
body[data-theme=noel] .btn.soft{background:rgb(179 32 47/.35);color:#f6ecd6;border:1px solid rgb(217 180 94/.3)}
body[data-theme=noel] .btn.ghost{border-color:rgb(217 180 94/.45);color:#e6c97f}
body[data-theme=noel] .seg{background:rgb(0 0 0/.3);border:1px solid rgb(217 180 94/.25)}

  const toMin = (s) => {

  const yearCfg = (S, y) => { const j = (S.urlaub.jahre || {})[y] || {}; return { tarif: j.tarif ?? S.urlaub.tarifTage, tzug: j.tzug ?? S.urlaub.tzugTage, rest: j.rest, restDatum: j.restDatum || '', tzugRest: j.tzugRest } };

  const TYPES = {

<script>/* Toki – kleiner QR-Code-Generator (Byte-Modus, Fehlerkorrektur M, Version 1–10). Ohne Bibliothek.
   Nach dem Verfahren der QR-Norm (ISO/IEC 18004); Aufbau angelehnt an Project Nayuki. */
const QR = (() => {
  'use strict';
  const ECC = [-1, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26]; // Fehlerkorrektur-Codewörter je Block (Stufe M)
  const BLK = [-1, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5]; // Anzahl Blöcke (Stufe M)
  const rawMods = (v) => { let r = (16 * v + 128) * v + 64; if (v >= 2) { const n = Math.floor(v / 7) + 2; r -= (25 * n - 10) * n - 55; if (v >= 7) r -= 36; } return r; };
  const dataCw = (v) => Math.floor(rawMods(v) / 8) - ECC[v] * BLK[v];

  const mul = (x, y) => { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11d); z ^= ((y >>> i) & 1) * x; } return z & 0xff; };
  const rsDivisor = (deg) => {
    const r = new Array(deg).fill(0); r[deg - 1] = 1; let root = 1;
    for (let i = 0; i < deg; i++) { for (let j = 0; j < r.length; j++) { r[j] = mul(r[j], root); if (j + 1 < r.length) r[j] ^= r[j + 1]; } root = mul(root, 2); }
    return r;
  };
  const rsRemainder = (data, div) => {
    const r = div.map(() => 0);
    for (const b of data) { const f = b ^ r.shift(); r.push(0); div.forEach((c, i) => { r[i] ^= mul(c, f); }); }
    return r;
  };
  const alignPos = (v, size) => {
    if (v === 1) return [];
    const n = Math.floor(v / 7) + 2, step = Math.ceil((v * 4 + 4) / (n * 2 - 2)) * 2, res = [6];
    for (let pos = size - 7; res.length < n; pos -= step) res.splice(1, 0, pos);
    return res;
  };

  function matrix(text) {
    const bytes = [...new TextEncoder().encode(text)];
    let v = 1;
    for (; v <= 10; v++) if (4 + (v < 10 ? 8 : 16) + bytes.length * 8 <= dataCw(v) * 8) break;
    if (v > 10) throw new Error('Text zu lang für QR-Code');
    // Bitstrom
    const bits = [];
    const ap = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    ap(4, 4); ap(bytes.length, v < 10 ? 8 : 16); bytes.forEach((b) => ap(b, 8));
    const cap = dataCw(v) * 8;
    ap(0, Math.min(4, cap - bits.length)); ap(0, (8 - (bits.length % 8)) % 8);
    for (let p = 0xec; bits.length < cap; p ^= 0xec ^ 0x11) ap(p, 8);
    const data = [];
    for (let i = 0; i < bits.length; i += 8) { let b = 0; for (let j = 0; j < 8; j++) b = (b << 1) | bits[i + j]; data.push(b); }
    // Blöcke + Reed-Solomon, verschränkt
    const nb = BLK[v], ecl = ECC[v], raw = Math.floor(rawMods(v) / 8), nShort = nb - (raw % nb), shortLen = Math.floor(raw / nb);
    const div = rsDivisor(ecl), blocks = [];
    for (let i = 0, k = 0; i < nb; i++) {
      const dat = data.slice(k, k + shortLen - ecl + (i < nShort ? 0 : 1)); k += dat.length;
      const ec = rsRemainder(dat, div);
      if (i < nShort) dat.push(0);
      blocks.push(dat.concat(ec));
    }
    const cw = [];
    for (let i = 0; i < blocks[0].length; i++) blocks.forEach((b, j) => { if (i !== shortLen - ecl || j >= nShort) cw.push(b[i]); });
    // Muster
    const size = v * 4 + 17;
    const m = [...Array(size)].map(() => Array(size).fill(false));
    const fn = [...Array(size)].map(() => Array(size).fill(false));
    const set = (x, y, d) => { m[y][x] = d; fn[y][x] = true; };
    for (let i = 0; i < size; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    const finder = (cx, cy) => { for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) { const d = Math.max(Math.abs(dx), Math.abs(dy)), x = cx + dx, y = cy + dy; if (x >= 0 && x < size && y >= 0 && y < size) set(x, y, d !== 2 && d !== 4); } };
    finder(3, 3); finder(size - 4, 3); finder(3, size - 4);
    const al = alignPos(v, size), n = al.length;
    for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) {
      if ((i === 0 && j === 0) || (i === 0 && j === n - 1) || (i === n - 1 && j === 0)) continue;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(al[i] + dx, al[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
    const drawFormat = (mask) => {
      const d = (0 << 3) | mask; // Stufe M = 00
      let rem = d; for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      const b = ((d << 10) | rem) ^ 0x5412, bit = (i) => ((b >>> i) & 1) !== 0;
      for (let i = 0; i <= 5; i++) set(8, i, bit(i));
      set(8, 7, bit(6)); set(8, 8, bit(7)); set(7, 8, bit(8));
      for (let i = 9; i < 15; i++) set(14 - i, 8, bit(i));
      for (let i = 0; i < 8; i++) set(size - 1 - i, 8, bit(i));
      for (let i = 8; i < 15; i++) set(8, size - 15 + i, bit(i));
      set(8, size - 8, true);
    };
    drawFormat(0);
    if (v >= 7) {
      let rem = v; for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1f25);
      const b = (v << 12) | rem;
      for (let i = 0; i < 18; i++) { const bit = ((b >>> i) & 1) !== 0, a = size - 11 + (i % 3), c = Math.floor(i / 3); set(a, c, bit); set(c, a, bit); }
    }
    // Daten im Zickzack einsetzen
    let k = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < size; vert++) for (let j = 0; j < 2; j++) {
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - vert : vert;
        if (!fn[y][x] && k < cw.length * 8) { m[y][x] = ((cw[k >>> 3] >>> (7 - (k & 7))) & 1) !== 0; k++; }
      }
    }
    // Maske mit geringster Strafpunktzahl wählen
    const cond = [(x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x) => x % 3 === 0, (x, y) => (x + y) % 3 === 0, (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => ((x * y) % 2) + ((x * y) % 3) === 0, (x, y) => (((x * y) % 2) + ((x * y) % 3)) % 2 === 0, (x, y) => (((x + y) % 2) + ((x * y) % 3)) % 2 === 0];
    const applyMask = (mk) => { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!fn[y][x] && cond[mk](x, y)) m[y][x] = !m[y][x]; };
    const penalty = () => {
      let p = 0, dark = 0;
      for (let y = 0; y < size; y++) {
        let rx = 1, ry = 1;
        for (let x = 0; x < size; x++) {
          if (m[y][x]) dark++;
          if (x > 0) { if (m[y][x] === m[y][x - 1]) { rx++; if (rx === 5) p += 3; else if (rx > 5) p++; } else rx = 1; }
          if (x > 0) { if (m[x][y] === m[x - 1][y]) { ry++; if (ry === 5) p += 3; else if (ry > 5) p++; } else ry = 1; }
          if (x > 0 && y > 0 && m[y][x] === m[y][x - 1] && m[y][x] === m[y - 1][x] && m[y][x] === m[y - 1][x - 1]) p += 3;
        }
      }
      return p + Math.floor(Math.abs(dark * 20 - size * size * 10) / (size * size)) * 10;
    };
    let best = 0, bestP = Infinity;
    for (let mk = 0; mk < 8; mk++) { applyMask(mk); drawFormat(mk); const p = penalty(); if (p < bestP) { bestP = p; best = mk; } applyMask(mk); }
    applyMask(best); drawFormat(best);
    return m;
  }

  /** QR-Code als SVG (dunkle Module als ein Pfad, 4 Module Ruhezone) */
  function svg(text, { px = 220, dark = '#111', light = '#fff' } = {}) {
    const m = matrix(text), n = m.length, q = 4, s = n + q * 2;
    let d = '';
    for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (m[y][x]) d += `M${x + q} ${y + q}h1v1h-1z`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${s} ${s}" width="${px}" height="${px}" shape-rendering="crispEdges" role="img" aria-label="QR-Code"><rect width="${s}" height="${s}" fill="${light}"/><path d="${d}" fill="${dark}"/></svg>`;
  }
  return { matrix, svg };
})();

</script>
<script>/* Toki – Cloud-Sync per persönlichem Sync-Code (ohne Login). Supabase-RPC, keine Bibliothek nötig.
   Der Code ist das Geheimnis: Wer ihn kennt, sieht die Daten. In der Datenbank liegt nur sein SHA-256-Hash. */
const Sync = (() => {
  'use strict';
  const BASE = 'https://niqkdhjzcpmyjuopgrnu.supabase.co';
  // Publishable Key: darf öffentlich im Code stehen. Zugriff nur über die Funktionen toki_laden / toki_speichern.
  const KEY = 'sb_publishable_6yXuxHgXlb12TCTrcKYkUg_Z7l6HXxA';
  const CKEY = 'toki-sync-code';
  const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // ohne 0/O, 1/I

  const read = () => { try { return localStorage.getItem(CKEY) || ''; } catch { return ''; } };
  let code = read();
  const store = (c) => { code = c || ''; try { if (c) localStorage.setItem(CKEY, c); else localStorage.removeItem(CKEY); } catch { /* */ } };

  /** Eingabe säubern: Groß, ohne Leerzeichen/Striche/Präfix */
  const clean = (s) => String(s || '').toUpperCase().replace(/^TOKI/, '').replace(/[^A-Z0-9]/g, '');
  const valid = (c) => c.length === 16 && [...c].every((ch) => ALPHA.includes(ch));
  const pretty = (c) => (c ? `TOKI-${c.match(/.{1,4}/g).join('-')}` : '');
  function generate() {
    const r = new Uint8Array(16);
    crypto.getRandomValues(r);
    return [...r].map((b) => ALPHA[b % ALPHA.length]).join('');
  }

  const available = () => /^https?:$/.test(location.protocol) && !/(^|\.)claude\.ai$|claudeusercontent|anthropic/.test(location.hostname);

  async function rpc(fn, body) {
    let r;
    try {
      r = await fetch(`${BASE}/rest/v1/rpc/${fn}`, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    } catch { throw new Error('Keine Verbindung zum Server'); }
    if (!r.ok) {
      const j = await r.json().catch(() => ({}));
      const msg = j.message || j.msg || j.error || `Fehler ${r.status}`;
      if (/Could not find the function|does not exist|PGRST202/i.test(msg + (j.code || ''))) throw new Error('Die Datenbank ist noch nicht eingerichtet (SQL aus supabase/schema.sql ausführen).');
      throw new Error(msg);
    }
    const t = await r.text();
    return t ? JSON.parse(t) : null;
  }

  /** Daten zu einem Code holen: { daten, aktualisiert } oder null */
  async function pull(c = code) {
    const rows = await rpc('toki_laden', { p_code: c });
    return (rows && rows[0]) || null;
  }
  async function push(daten, updatedMs, c = code) {
    await rpc('toki_speichern', { p_code: c, p_daten: daten, p_aktualisiert: new Date(updatedMs || Date.now()).toISOString() });
  }

  /** Link wie …/Toki/#sync=CODE verbindet ein neues Gerät mit einem Tipp */
  function fromHash() {
    const m = /[#&]sync=([A-Za-z0-9-]+)/.exec(location.hash || '');
    if (!m) return null;
    try { history.replaceState(null, '', location.pathname + location.search); } catch { /* */ }
    const c = clean(m[1]);
    return valid(c) ? c : { error: 'Ungültiger Sync-Link' };
  }

  return {
    get code() { return code; }, set: store, clean, valid, pretty, generate, available, pull, push, fromHash,
    link: (c = code) => `${location.origin}${location.pathname}#sync=${c}`,
  };
})();
</script>
